<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Fluxo de Caixa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #000000;
            --bg-elev: #0a0a0a;
            --surface: #111113;
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.14);
            --text: #fafaf9;
            --text-dim: #a1a1aa;
            --text-faint: #71717a;
            --accent: #22c55e;
            --accent-bright: #4ade80;
            --accent-dim: rgba(34,197,94,0.12);
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
            background:
                radial-gradient(ellipse 900px 500px at 15% -10%, rgba(34,197,94,0.10), transparent),
                radial-gradient(ellipse 700px 500px at 100% 0%, rgba(34,197,94,0.06), transparent),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-badge { width: 34px; height: 34px; filter: drop-shadow(0 0 10px rgba(34,197,94,0.5)); }
        @keyframes logoSpin { to { transform: rotate(360deg); } }
        .logo-spin { transform-origin: 50px 50px; animation: logoSpin 3.5s linear infinite; }
        .header h1 { font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
        .header .sub { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; color: var(--text-dim); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
        .status.offline .status-dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .hero { background: linear-gradient(155deg, #0d1a12 0%, #0a0a0a 55%, #000 100%); border: 1px solid rgba(34,197,94,0.25); border-radius: 24px; padding: 32px 28px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04); position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -60%; right: -15%; width: 260px; height: 260px; background: radial-gradient(circle, rgba(34,197,94,0.18), transparent 70%); border-radius: 50%; }
        .hero-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; color: var(--accent-bright); position: relative; z-index: 1; }
        .balance { font-size: 46px; font-weight: 800; margin-top: 8px; position: relative; z-index: 1; letter-spacing: -0.5px; }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: border-color 0.2s; }
        .card-label { font-size: 11px; color: var(--text-faint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
        .card-value { font-size: 22px; font-weight: 700; }
        .card:nth-child(1) .card-value { color: var(--accent-bright); }
        .card:nth-child(2) .card-value { color: #e4e4e7; }
        .card:nth-child(3) .card-value { color: #e4e4e7; }
        .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
        .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .table-header h3 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); }
        .table-count { font-size: 11px; font-weight: 600; color: var(--accent-bright); background: var(--accent-dim); padding: 4px 12px; border-radius: 20px; }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint); border-bottom: 1px solid var(--border); }
        td { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 14px; color: var(--text-dim); }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid transparent; }
        .badge-pix { background: var(--accent-dim); color: var(--accent-bright); border-color: rgba(34,197,94,0.25); }
        .badge-card { background: rgba(255,255,255,0.06); color: #d4d4d8; border-color: var(--border-strong); }
        .badge-cash { background: rgba(255,255,255,0.06); color: #d4d4d8; border-color: var(--border-strong); }
        .amount { font-weight: 700; color: var(--accent-bright); }
        .btn-delete { background: none; border: none; cursor: pointer; font-size: 15px; padding: 6px; border-radius: 8px; opacity: 0.6; }
        .btn-delete:hover { opacity: 1; background: rgba(239,68,68,0.12); }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-primary { flex: 2; padding: 16px; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; color: #05170c; background: linear-gradient(135deg, var(--accent-bright), var(--accent)); box-shadow: 0 4px 20px rgba(34,197,94,0.35); min-width: 200px; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { flex: 1; padding: 16px; border: 1px solid var(--border-strong); border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; color: var(--text-dim); background: var(--surface); min-width: 120px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; align-items: flex-end; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: linear-gradient(180deg, #0d0d0f, #000); border: 1px solid var(--border-strong); border-radius: 20px 20px 0 0; padding: 28px 24px; width: 100%; max-width: 450px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal h2 { font-size: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-faint); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
        .form-group select { appearance: none; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 24px; }
        .btn-cancel { flex: 1; padding: 14px; border: 1px solid var(--border-strong); background: transparent; color: var(--text); border-radius: 12px; font-size: 15px; cursor: pointer; }
        .btn-save { flex: 2; padding: 14px; background: linear-gradient(135deg, var(--accent-bright), var(--accent)); border: none; color: #05170c; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .btn-save:disabled { opacity: 0.6; }
        .empty-state { text-align: center; padding: 40px; color: var(--text-faint); }
        .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
        @media (max-width: 600px) {
            .cards { grid-template-columns: 1fr; }
            .balance { font-size: 36px; }
            .hero { padding: 24px 20px; }
            .header h1 { font-size: 17px; }
        }
        .lock-screen { position: fixed; inset: 0; background:
                radial-gradient(ellipse 900px 500px at 15% -10%, rgba(34,197,94,0.10), transparent),
                radial-gradient(ellipse 700px 500px at 100% 100%, rgba(34,197,94,0.06), transparent),
                var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .lock-box { width: 100%; max-width: 360px; text-align: center; }
        .lock-badge { width: 64px; height: 64px; margin: 0 auto 18px; filter: drop-shadow(0 0 16px rgba(34,197,94,0.5)); }
        .lock-icon { font-size: 40px; margin-bottom: 16px; }
        .lock-box h2 { font-size: 20px; margin-bottom: 6px; font-weight: 700; }
        .lock-sub { font-size: 13px; color: var(--text-faint); margin-bottom: 24px; }
        .lock-box input { width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
        .lock-box input:focus { outline: none; border-color: var(--accent); }
        .lock-box .btn-save, .lock-box .btn-primary { width: 100%; margin-bottom: 10px; }
        .btn-bio { width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid rgba(34,197,94,0.35); background: var(--accent-dim); color: var(--accent-bright); margin-bottom: 12px; }
        .lock-error { color: var(--danger); font-size: 13px; margin-top: -4px; margin-bottom: 12px; min-height: 16px; }
        .lock-hint { font-size: 11px; color: var(--text-faint); margin-top: 8px; }
        .lock-link { background: none; border: none; color: var(--text-faint); font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="lock-screen" id="lockScreen">
        <div class="lock-box" id="lockBox"></div>
    </div>
    <div class="container" id="appContainer" style="display:none;">
        <div class="header">
            <div class="brand">
                <svg class="brand-badge" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" fill="#111" stroke="#22C55E" stroke-width="3"/>
                    <g class="logo-spin">
                        <path d="M50 18 A32 32 0 1 1 18 50" stroke="#22C55E" stroke-width="5" stroke-linecap="round" fill="none"/>
                        <polygon points="50,8 42,22 58,22" fill="#22C55E"/>
                    </g>
                    <text x="50" y="66" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="white">B</text>
                </svg>
                <div>
                    <h1>Fluxo de Caixa</h1>
                    <div class="sub">BlackOut</div>
                </div>
            </div>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span id="statusText">Conectando...</span>
            </div>
        </div>

        <div class="hero">
            <div class="hero-label">💎 Saldo Disponível</div>
            <div class="balance" id="balance">R$ 0,00</div>
        </div>

        <div class="cards">
            <div class="card">
                <div class="card-label">📱 Pix</div>
                <div class="card-value" id="pix">R$ 0,00</div>
            </div>
            <div class="card">
                <div class="card-label">💳 Cartão</div>
                <div class="card-value" id="card">R$ 0,00</div>
            </div>
            <div class="card">
                <div class="card-label">💵 Dinheiro</div>
                <div class="card-value" id="cash">R$ 0,00</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3>📋 Histórico de Entradas</h3>
                <span class="table-count" id="entryCount">0 registros</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>📅 Data</th>
                            <th>📝 Descrição</th>
                            <th>💳 Forma</th>
                            <th>💰 Valor</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="rows">
                        <tr>
                            <td colspan="5">
                                <div class="empty-state">
                                    <div class="empty-icon">📭</div>
                                    <div>Carregando...</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="openModal()">＋ Nova Entrada</button>
            <button class="btn-secondary" onclick="loadData()">🔄 Atualizar</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>✨ Registrar Entrada</h2>
            <form onsubmit="saveEntry(event)">
                <div class="form-group">
                    <label>📝 Descrição</label>
                    <input type="text" id="desc" required placeholder="Ex: Venda de produto">
                </div>
                <div class="form-group">
                    <label>💳 Forma de Pagamento</label>
                    <select id="method" required>
                        <option value="Pix">📱 Pix</option>
                        <option value="Cartão">💳 Cartão</option>
                        <option value="Dinheiro no balcão">💵 Dinheiro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>💰 Valor (R$)</label>
                    <input type="number" id="amount" required placeholder="0,00" step="0.01" min="0.01" inputmode="decimal">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-save">💾 Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://kihnavaovspdjnegcraj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_h5AITv-_Fjmnq-xC6UC8xg_8CSMLoZK';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== Bloqueio de acesso (senha + Face ID / Digital via WebAuthn) =====
        // Proteção local no dispositivo: não é autenticação de servidor, apenas
        // uma trava de acesso rápido no navegador (a chave do Supabase já é pública).
        const PWD_KEY = 'fc_pwd_hash';
        const BIO_KEY = 'fc_bio_credential_id';

        async function sha256(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return btoa(String.fromCharCode(...new Uint8Array(buf)));
        }

        function b64uToBuf(b64u) {
            const b64 = b64u.replace(/-/g, '+').replace(/_/g, '/').padEnd(b64u.length + (4 - b64u.length % 4) % 4, '=');
            return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        }
        function bufToB64u(buf) {
            return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        const bioSupported = !!(window.PublicKeyCredential && window.isSecureContext);

        const LOGO_SVG = `<svg class="lock-badge" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="48" fill="#111" stroke="#22C55E" stroke-width="3"/>
            <g class="logo-spin">
                <path d="M50 18 A32 32 0 1 1 18 50" stroke="#22C55E" stroke-width="5" stroke-linecap="round" fill="none"/>
                <polygon points="50,8 42,22 58,22" fill="#22C55E"/>
            </g>
            <text x="50" y="66" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="white">B</text>
        </svg>`;

        function unlockApp() {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = '';
            loadData();
        }

        async function registerBiometric() {
            const challenge = crypto.getRandomValues(new Uint8Array(32));
            const userId = crypto.getRandomValues(new Uint8Array(16));
            const cred = await navigator.credentials.create({
                publicKey: {
                    challenge,
                    rp: { name: 'Fluxo de Caixa' },
                    user: { id: userId, name: 'usuario', displayName: 'Usuário' },
                    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
                    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
                    timeout: 60000
                }
            });
            localStorage.setItem(BIO_KEY, bufToB64u(cred.rawId));
        }

        async function authBiometric() {
            const credId = localStorage.getItem(BIO_KEY);
            if (!credId) return false;
            const challenge = crypto.getRandomValues(new Uint8Array(32));
            try {
                await navigator.credentials.get({
                    publicKey: {
                        challenge,
                        allowCredentials: [{ id: b64uToBuf(credId), type: 'public-key' }],
                        userVerification: 'required',
                        timeout: 60000
                    }
                });
                return true;
            } catch (e) {
                console.warn('Face ID/Digital cancelado ou falhou:', e);
                return false;
            }
        }

        function renderSetupScreen() {
            const box = document.getElementById('lockBox');
            box.innerHTML = `
                ${LOGO_SVG}
                <h2>Criar senha de acesso</h2>
                <div class="lock-sub">Defina uma senha para proteger o fluxo de caixa neste aparelho</div>
                <input type="password" id="newPwd" placeholder="Nova senha" inputmode="numeric" autocomplete="new-password">
                <input type="password" id="newPwd2" placeholder="Confirmar senha" inputmode="numeric" autocomplete="new-password">
                <div class="lock-error" id="lockErr"></div>
                <button class="btn-save" id="setupBtn">💾 Salvar senha</button>
            `;
            document.getElementById('setupBtn').onclick = async () => {
                const p1 = document.getElementById('newPwd').value;
                const p2 = document.getElementById('newPwd2').value;
                const err = document.getElementById('lockErr');
                if (!p1 || p1.length < 4) { err.textContent = 'Use pelo menos 4 caracteres'; return; }
                if (p1 !== p2) { err.textContent = 'As senhas não coincidem'; return; }
                localStorage.setItem(PWD_KEY, await sha256(p1));
                if (bioSupported) {
                    renderOfferBiometricScreen();
                } else {
                    unlockApp();
                }
            };
        }

        function renderOfferBiometricScreen() {
            const box = document.getElementById('lockBox');
            box.innerHTML = `
                ${LOGO_SVG}
                <h2>Ativar Face ID / Digital?</h2>
                <div class="lock-sub">Desbloqueie mais rápido nas próximas vezes usando a biometria deste aparelho</div>
                <button class="btn-bio" id="enableBioBtn">🆔 Ativar Face ID / Digital</button>
                <button class="lock-link" id="skipBioBtn">Agora não</button>
                <div class="lock-error" id="lockErr"></div>
            `;
            document.getElementById('enableBioBtn').onclick = async () => {
                try {
                    await registerBiometric();
                    unlockApp();
                } catch (e) {
                    console.error(e);
                    document.getElementById('lockErr').textContent = 'Não foi possível ativar. Você ainda pode usar a senha.';
                }
            };
            document.getElementById('skipBioBtn').onclick = unlockApp;
        }

        function renderLoginScreen() {
            const box = document.getElementById('lockBox');
            const hasBio = bioSupported && !!localStorage.getItem(BIO_KEY);
            box.innerHTML = `
                ${LOGO_SVG}
                <h2>Fluxo de Caixa</h2>
                <div class="lock-sub">Digite a senha para continuar</div>
                ${hasBio ? '<button class="btn-bio" id="bioBtn">🆔 Desbloquear com Face ID / Digital</button>' : ''}
                <input type="password" id="loginPwd" placeholder="Senha" inputmode="numeric" autocomplete="current-password">
                <div class="lock-error" id="lockErr"></div>
                <button class="btn-primary" id="loginBtn">Entrar</button>
                ${hasBio ? '<button class="lock-link" id="forgetBioBtn">Não usar biometria neste aparelho</button>' : ''}
            `;
            const tryPassword = async () => {
                const p = document.getElementById('loginPwd').value;
                const hash = localStorage.getItem(PWD_KEY);
                if (await sha256(p) === hash) {
                    unlockApp();
                } else {
                    document.getElementById('lockErr').textContent = 'Senha incorreta';
                }
            };
            document.getElementById('loginBtn').onclick = tryPassword;
            document.getElementById('loginPwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryPassword(); });
            if (hasBio) {
                document.getElementById('bioBtn').onclick = async () => {
                    if (await authBiometric()) unlockApp();
                    else document.getElementById('lockErr').textContent = 'Não foi possível verificar. Tente a senha.';
                };
                document.getElementById('forgetBioBtn').onclick = () => {
                    localStorage.removeItem(BIO_KEY);
                    renderLoginScreen();
                };
                // Tenta biometria automaticamente ao abrir, se disponível
                setTimeout(() => document.getElementById('bioBtn')?.click(), 300);
            }
        }

        function initLock() {
            if (!localStorage.getItem(PWD_KEY)) {
                renderSetupScreen();
            } else {
                renderLoginScreen();
            }
        }

        const fmt = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        function updateStatus(online, message) {
            const s = document.getElementById('status');
            const t = document.getElementById('statusText');
            s.className = 'status' + (online ? '' : ' offline');
            t.textContent = message || (online ? '✅ Conectado' : '❌ Offline');
        }

        async function loadData() {
            updateStatus(false, '⏳ Carregando...');

            try {
                const { data: entries, error } = await supabase
                    .from('entries')
                    .select('*')
                    .order('entry_date', { ascending: false })
                    .order('created_at', { ascending: false });

                if (error) throw new Error(error.message);

                console.log('📊 Dados:', entries);

                // Calcula os totais
                const totals = (entries || []).reduce((acc, e) => {
                    const amt = Number(e.amount || 0);
                    acc.geral += amt;
                    if (e.method === 'Pix') acc.pix += amt;
                    else if (e.method === 'Cartão') acc.cartao += amt;
                    else acc.dinheiro += amt;
                    return acc;
                }, { geral: 0, pix: 0, cartao: 0, dinheiro: 0 });

                document.getElementById('balance').textContent = fmt(totals.geral);
                document.getElementById('pix').textContent = fmt(totals.pix);
                document.getElementById('card').textContent = fmt(totals.cartao);
                document.getElementById('cash').textContent = fmt(totals.dinheiro);

                document.getElementById('entryCount').textContent = (entries || []).length + ' registro' + (entries.length !== 1 ? 's' : '');

                const rows = document.getElementById('rows');

                if (!entries || entries.length === 0) {
                    rows.innerHTML = '<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">📭</div><div>Nenhuma entrada ainda</div></div></td></tr>';
                } else {
                    rows.innerHTML = entries.map(e => {
                        const badgeClass = 'badge-' + (e.method === 'Pix' ? 'pix' : e.method === 'Cartão' ? 'card' : 'cash');
                        return `<tr>
                            <td>${e.entry_date || '-'}</td>
                            <td>${escapeHtml(e.description) || '-'}</td>
                            <td><span class="badge ${badgeClass}">${e.method || '-'}</span></td>
                            <td class="amount">${fmt(e.amount)}</td>
                            <td><button class="btn-delete" onclick="deleteEntry('${e.id}')" title="Excluir">🗑️</button></td>
                        </tr>`;
                    }).join('');
                }

                updateStatus(true);
                console.log('✅ Dados carregados!');

            } catch (error) {
                console.error('❌ Erro:', error);
                updateStatus(false, '❌ ' + error.message);

                document.getElementById('rows').innerHTML = `<tr><td colspan="5"><div class="empty-state" style="color:#ef4444;">⚠️ ${error.message}<br><small style="font-size:12px;color:#666;">Verifique o console (F12) para detalhes</small></div></td></tr>`;
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        async function deleteEntry(id) {
            if (!confirm('Excluir esta entrada? Essa ação não pode ser desfeita.')) return;
            try {
                const { error } = await supabase.from('entries').delete().eq('id', id);
                if (error) throw new Error(error.message);
                await loadData();
            } catch (error) {
                console.error('❌ Erro ao excluir:', error);
                alert('Erro ao excluir: ' + error.message);
            }
        }

        async function saveEntry(e) {
            e.preventDefault();

            const desc = document.getElementById('desc').value.trim();
            const method = document.getElementById('method').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if (!desc || !amount || amount <= 0) {
                alert('⚠️ Preencha todos os campos corretamente');
                return;
            }

            const btn = document.querySelector('.btn-save');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Salvando...';
            btn.disabled = true;

            try {
                const { error } = await supabase
                    .from('entries')
                    .insert({ description: desc, method: method, amount: amount });

                if (error) throw new Error(error.message);

                closeModal();
                await loadData();
                alert('✅ Entrada adicionada com sucesso!');

            } catch (error) {
                console.error('❌ Erro ao salvar:', error);
                alert('Erro: ' + error.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        window.saveEntry = saveEntry;
        window.loadData = loadData;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.deleteEntry = deleteEntry;

        function openModal() {
            document.getElementById('modal').classList.add('active');
            document.getElementById('desc').focus();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.querySelector('form').reset();
        }

        // Fecha modal com ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Fecha modal clicando fora
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Inicia o dashboard (após desbloqueio)
        console.log('🚀 Iniciando Fluxo de Caixa...');
        initLock();

        // Atualiza a cada 30 segundos (só quando desbloqueado)
        setInterval(() => {
            if (document.getElementById('appContainer').style.display !== 'none') loadData();
        }, 30000);
    </script>
</body>
</html>
