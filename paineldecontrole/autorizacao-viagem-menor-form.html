}
const s = {

    acomp_tipo: '', acomp_desc: '', acompanhantes: [], emergencia: [],

let stepIndex = 0;

let mostrarDocs = false;
const ROTULOS_ETAPAS = ['Quem autoriza', 'Dados do menor', 'Acompanhante', 'Viagem e transporte', 'Validade e conferência'];

// ---------- Cidade/bairro (mesma lista e comportamento dos formulários de contratos/declarações) ----------
// Cidades da região com bairro em lista; "Outra" libera cidade e bairro livres. Cidades da lista
// definem o estado como SC (campo UF some); "Outra" pede a UF.
const CIDADES_BAIRROS = {
    'Camboriú': ['Areias', 'Cedro', 'Centro', 'Conde Vila Verde', 'Lídia Duarte', 'Monte Alegre', 'Rio Pequeno', 'Santa Regina', 'São Francisco de Assis', 'Tabuleiro', 'Várzea do Ranchinho'],
    'Balneário Camboriú': ['Ariribá', 'Barra', 'Barra Norte', 'Barra Sul', 'Centro', 'Estados', 'Estaleiro', 'Estaleirinho', 'Interpraias', 'Jardim Iate Clube', 'Laranjeiras', 'Municípios', 'Nações', 'Nova Esperança', 'Pioneiros', 'Praia dos Amores', 'São Judas', 'Vila Real'],
    'Itapema': ['Alto do São Bento', 'Andorinha', 'Canto da Praia', 'Casa Branca', 'Castelo Branco', 'Centro', 'Ilhota', 'Meia Praia', 'Morretes', 'Sertãozinho', 'Tabuleiro dos Oliveiras', 'Várzea'],
    'Itajaí': ['Centro', 'Cabeçudas', 'Praia Brava', 'Fazenda', 'Cordeiros', 'São Vicente', 'Barra do Rio', 'Dom Bosco', 'São João', 'Espinheiros', 'Ressacada', 'Salseiros', 'Vila Operária', 'Murta', 'Rio Bonito'],
};
const CIDADES_OPTS = [...Object.keys(CIDADES_BAIRROS), 'Outra'];
const CIDADES_SC = ['Camboriú', 'Balneário Camboriú', 'Itapema', 'Itajaí'];

// ---------- Utilidades ----------
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pill(name, value, checked, label, path, re, tipo) {
    const id = name + '_' + String(value).replace(/\W/g, '');
    return `<label class="radio-pill"><input type="${tipo || 'radio'}" name="${name}" id="${id}" value="${esc(value)}" ${checked ? 'checked' : ''} ${path ? `data-p="${path}"` : ''} ${re ? 'data-re="1"' : ''}><span class="pill-label">${esc(label || value)}</span></label>`;
}
function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, v) {
    const ks = path.split('.'); let a = o;
    for (let i = 0; i < ks.length - 1; i++) a = a[ks[i]];
    a[ks[ks.length - 1]] = v;
}
// Campo de texto/select/data ligado a um caminho do estado (grava a cada digitação, então voltar/avançar
// e adicionar/remover pessoas nunca perde o que já foi preenchido).
function campo(label, path, opts = {}) {
    const v = getPath(s, path) ?? '';
    const marc = opts.obrig === false ? ' <span style="font-weight:400;color:var(--text-faint)">(opcional)</span>' : ' *';
    const idc = 'f_' + path.replace(/\W/g, '_'); // ids terminados em cpf/cep recebem a máscara (assets/campo-documentos.js)
    let ctl;
    if (opts.select) {
        ctl = `<select id="${idc}" data-p="${path}" ${opts.re ? 'data-re="1"' : ''}><option value="">Selecione</option>${opts.select.map(o => `<option value="${esc(o)}" ${v === o ? 'selected' : ''}>${o === '__outro__' ? 'Outro bairro' : esc(o)}</option>`).join('')}</select>`;
    } else if (opts.textarea) {
        ctl = `<textarea id="${idc}" data-p="${path}" placeholder="${esc(opts.ph || '')}">${esc(v)}</textarea>`;
    } else {
        ctl = `<input type="${opts.type || 'text'}" id="${idc}" data-p="${path}" value="${esc(v)}" ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ''} ${opts.readonly ? 'readonly' : ''} ${opts.max ? `max="${opts.max}"` : ''} ${opts.type === 'date' ? 'max="9999-12-31"' : ''}>`;
    }
    return `<div class="field"><label for="${idc}">${esc(label)}${marc}</label>${ctl}${opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : ''}</div>`;
}
// Data de nascimento em 3 campos (Dia / Mês / Ano), no mesmo formato visual do currículo
// (.date-row). Os pedaços digitados ficam em obj.nasc_d / nasc_m / nasc_a (preservados ao
// voltar/avançar) e obj.nasc guarda a data ISO (AAAA-MM-DD) só quando completa e existente —
// é o formato interno de sempre (dados.*.data_nascimento).
function nascPartes(o) {
    if (o.nasc_d === undefined && o.nasc_m === undefined && o.nasc_a === undefined) {
        const [a, m, d] = (o.nasc || '').split('-'); o.nasc_d = d || ''; o.nasc_m = m || ''; o.nasc_a = a || '';
    }
    return o;
}
function nascRecalcular(o) {
    const d = o.nasc_d || '', m = o.nasc_m || '', a = o.nasc_a || '';
    const iso = (d.length === 2 && m.length === 2 && a.length === 4) ? `${a}-${m}-${d}` : '';
    o.nasc = (iso && dataValida(iso)) ? iso : '';
}
function nascErro(o) { // mensagem clara ou '' quando a data é válida
    nascPartes(o);
    const d = o.nasc_d || '', m = o.nasc_m || '', a = o.nasc_a || '';
    if (!d && !m && !a) return 'Informe a data de nascimento.';
    if (d.length !== 2 || m.length !== 2 || a.length !== 4) return 'Data incompleta: use dia com 2 dígitos, mês com 2 dígitos e ano com 4 dígitos (DD/MM/AAAA).';
    if (!dataValida(`${a}-${m}-${d}`)) return 'Essa data não existe no calendário. Confira dia, mês e ano.';
    if (Number(a) < 1900) return 'Ano inválido. Confira o ano de nascimento.';
    if (`${a}-${m}-${d}` > hojeISO()) return 'A data de nascimento não pode ser futura.';
    return '';
}
function campoNasc(label, path) {
    const base = path.replace(/\.nasc$/, '');
    const o = nascPartes(getPath(s, base));
    const id = 'f_' + path.replace(/\W/g, '_');
    const ini = (o.nasc_d || o.nasc_m || o.nasc_a) ? nascErro(o) : '';
    const inp = (parte, ph, max, cls) => `<input type="text" inputmode="numeric" autocomplete="off" maxlength="${max}" id="${id}_${parte}" data-nasc="${path}|${parte}" class="${cls || ''}" value="${esc(o['nasc_' + parte[0]] || '')}" placeholder="${ph}" aria-label="${label} — ${ph}">`;
    return `<div class="field"><label for="${id}_dia">${esc(label)} *</label>
        <div class="date-row">${inp('dia', 'DD', 2)}${inp('mes', 'MM', 2)}${inp('ano', 'AAAA', 4, 'ano')}</div>
        <div class="hint" id="${id}_msg" style="color:var(--danger)">${esc(ini)}</div></div>`;
}
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function dataValida(iso) { return /^\d{4}-\d{2}-\d{2}$/.test(iso || '') && !isNaN(new Date(iso + 'T00:00:00').getTime()) && new Date(iso + 'T00:00:00').toISOString().slice(0, 10) === iso; }
function idadeEm(nascISO, refISO) {
    if (!dataValida(nascISO) || !dataValida(refISO)) return null;
    const n = new Date(nascISO + 'T00:00:00'), r = new Date(refISO + 'T00:00:00');
    let a = r.getFullYear() - n.getFullYear();
    if (r.getMonth() < n.getMonth() || (r.getMonth() === n.getMonth() && r.getDate() < n.getDate())) a--;
    return a;
}
function fmtData(iso) { return dataValida(iso) ? iso.split('-').reverse().join('/') : ''; }
const soDigitos = (v) => String(v || '').replace(/\D/g, '');
function cpfOk(v) { return window.Documentos.cpfValido(v); }
function mascaraDoc(v, tipo) { // exibição reduzida (privacidade): só os últimos dígitos
    const d = soDigitos(v); if (!d) return '';
    if (mostrarDocs) return tipo === 'cpf' ? window.Documentos.mascarar(v, 'cpf') : v;
    if (tipo === 'cpf' && d.length === 11) return `•••.•••.${d.slice(6, 9)}-••`;
    return '•'.repeat(Math.max(0, String(v).length - 3)) + String(v).slice(-3);
}
const nacFinal = (uid) => window.Nacionalidade.final(nac, uid + '_nacionalidade');

// Endereço padrão (cidade/bairro/UF) de uma pessoa: p.cid_sel / bai_sel / cidade_outra / bairro_outro /
// uf_sel guardam o que foi escolhido na tela; p.cidade, p.bairro e p.uf guardam o valor final
// (é o que validações, resumo e documento usam).
function enderecoDerivar(p) {
    if (p.cid_sel !== undefined) return;
    const c = p.cidade || '', b = p.bairro || '';

    else { p.cid_sel = c ? 'Outra' : ''; p.cidade_outra = c; p.bai_sel = ''; p.bairro_outro = b; }
    p.uf_sel = CIDADES_BAIRROS[c] ? '' : (p.uf || '');
}
function enderecoSincronizar(p) {
    const lista = !!CIDADES_BAIRROS[p.cid_sel];
    p.cidade = p.cid_sel === 'Outra' ? (p.cidade_outra || '').trim() : (p.cid_sel || '');
    p.bairro = (p.cid_sel === 'Outra' || p.bai_sel === '__outro__') ? (p.bairro_outro || '').trim() : (p.bai_sel || '');

function calcularAlertas() {

    if (idade !== null && idade >= 16 && idade < 18) a.push('Adolescente de 16 ou 17 anos: conferir se a empresa de transporte ou o destino exige autorização formal mesmo assim.');
    if (dataValida(m.nasc) && dataValida(s.validade.fim) && idadeEm(m.nasc, s.validade.fim) >= 18 && idade < 18) a.push('O menor completa 18 anos antes do fim da validade informada.');
    if (s.acomp_tipo === 'desacompanhado') a.push('Menor viajando desacompanhado: verificar exigências legais (inclusive possível autorização judicial ou notarial) e as regras da empresa de transporte antes de emitir o documento.');

    if (t.id === 'btnAddAut') { if (s.autorizantes.length < MAX_AUTORIZANTES) s.autorizantes.push(novaPessoa('aut')); render(); return; }
    if (d.removerDoc !== undefined) { s.docs.splice(Number(d.removerDoc), 1); render(); return; }
    if (t.id === 'btnAddDoc') { s.docs.push({ uid: novoUid('doc'), tipo: 'Outro documento', numero: '', descricao: '', ativo: true }); render(); return; }
    if (d.removerEmerg !== undefined) { s.emergencia.splice(Number(d.removerEmerg), 1); render(); return; }
    if (t.id === 'btnAddEmerg') { s.emergencia.push({ nome: '', parentesco: '', tel_ddd: '', tel_num: '' }); render(); return; }
    if (d.goto !== undefined) { stepIndex = Number(d.goto); render(); window.scrollTo(0, 0); return; }
    if (t.id === 'btnMostrarDocs') { mostrarDocs = !mostrarDocs; refrescarResumo(); return; }
    if (t.id === 'btnUsarDatasViagem') { s.validade.inicio = s.viagem.saida; s.validade.fim = s.viagem.retorno; render(); return; }
    if (t.id === 'btnRascunho') { ev.preventDefault(); salvarRascunho(); return; }
    if (t.id === 'btnContinuarRascunho') { restaurarRascunho(); return; }
    if (t.id === 'btnDescartarRascunho') { limparRascunho(); rascunhoOferecido = null; render(); return; }
    if (t.id === 'btnSubmit') { submitForm(); return; }
});

// ---------- Rascunho (salvar e retomar) ----------
// Fica só neste aparelho/navegador (localStorage), expira em 7 dias e é apagado ao enviar.
function salvarRascunho() {
    try {
        localStorage.setItem(RASCUNHO_KEY, JSON.stringify({ t: Date.now(), step: stepIndex, s, nac, UID }));
        showError('Rascunho salvo neste aparelho (vale por 7 dias).');
        const el = document.getElementById('errorMsg'); if (el) el.style.color = 'var(--accent-bright)';
    } catch (e) { showError('Não foi possível salvar o rascunho neste navegador.'); }
}
function lerRascunho() {
    try {
        const r = JSON.parse(localStorage.getItem(RASCUNHO_KEY) || 'null');
        if (!r || !r.s || Date.now() - r.t > RASCUNHO_VALIDADE_MS) { if (r) limparRascunho(); return null; }
        return r;
    } catch (e) { return null; }
}
function limparRascunho() { try { localStorage.removeItem(RASCUNHO_KEY); } catch (e) {} }
function aplicarEstado(salvo, salvoNac) {
    Object.keys(s).forEach(k => delete s[k]);
    Object.assign(s, salvo);
    // limites do modelo: no máximo 2 autorizantes e 1 acompanhante (rascunhos/registros antigos)
    if (s.autorizantes && s.autorizantes.length > MAX_AUTORIZANTES) s.autorizantes.length = MAX_AUTORIZANTES;
    if (s.acompanhantes && s.acompanhantes.length > 1) s.acompanhantes.length = 1;
    if (s.acomp_tipo === 'ambos') s.acomp_tipo = '';
    Object.keys(nac).forEach(k => delete nac[k]);
    Object.assign(nac, salvoNac || {});
}
function restaurarRascunho() {
    const r = lerRascunho(); if (!r) return;
    aplicarEstado(r.s, r.nac); UID = Math.max(UID, r.UID || 0); stepIndex = r.step || 0;
    rascunhoOferecido = null; render();
}

// ---------- Envio ----------
function pessoaSaida(p) {
    const aut = String(p.uid).startsWith('aut'); // autorizante: RG só número, sem CEP, endereço padrão
    if (aut) { enderecoDerivar(p); enderecoSincronizar(p); }
    return {
        nome: p.nome.trim(), nacionalidade: nacFinal(p.uid), estado_civil: p.estado_civil || null, profissao: (p.profissao || '').trim() || null, data_nascimento: p.nasc || null,
        cpf: p.cpf.trim() || null, rg: p.rg_num.trim() || null, rg_orgao: aut ? null : (p.rg_org.trim() || null), rg_uf: aut ? null : (p.rg_uf || null),
        cep: aut ? null : (p.cep.trim() || null), rua: p.rua.trim(), numero: p.numero.trim(), complemento: p.complemento.trim() || null,
        bairro: p.bairro.trim(), cidade: p.cidade.trim(), estado: p.uf,
        endereco: [p.rua.trim() + (p.numero.trim() ? ', ' + p.numero.trim() : ''), p.complemento.trim()].filter(Boolean).join(', '),
        telefone: window.Telefone.formatar(p, 'tel') || null,
    };
}
function montarRegistro() {
    const m = s.menor;
    const idade = idadeEm(m.nasc, hojeISO());
    const aut = s.autorizantes.map(p => Object.assign(pessoaSaida(p), { condicao: p.condicao, condicao_descricao: p.condicao_desc || null }));
    const ac = acompanhantesAtivos().map((p, i) => {
        const orig = p.ref ? s.autorizantes.find(x => x.uid === p.ref) : null;
        const idxAut = orig ? s.autorizantes.indexOf(orig) + 1 : null;
        return Object.assign(pessoaSaida(orig || p), { parentesco: p.parentesco || (orig && orig.condicao) || null, parentesco_descricao: p.parentesco_desc || null, mesma_pessoa_do_autorizante: idxAut });
    });
    const acs = acompanhantesAtivos();
    let recebedor = null;
    if (s.rec_tem === 'Sim') {
        if (acs.length && s.rec_modo === 'mesma') { recebedor = { mesma_pessoa_do_acompanhante: 1 }; }
        else recebedor = { nome: s.rec.nome.trim(), documento: s.rec.doc.trim() || null, telefone: window.Telefone.formatar(s.rec, 'tel'), cidade: s.rec.cidade.trim(), estado: s.rec.uf, parentesco: s.rec.parentesco, parentesco_descricao: s.rec.parentesco_desc || null, endereco: s.rec.endereco.trim() || null };
    }
    const docs = [];
    if (m.cpf.trim()) docs.push({ tipo: 'CPF', numero: m.cpf.trim() });
    s.docs.filter(d => d.ativo && d.numero.trim()).forEach(d => docs.push({ tipo: d.tipo, numero: d.numero.trim(), descricao: d.descricao || null }));
    const t = s.transp;
    return {
        tipo_contrato: TIPO,
        dados: {
            pessoa_a: aut[0],
            pessoa_b: { nome: m.nome.trim(), nacionalidade: nacFinal('menor'), data_nascimento: m.nasc, cpf: m.cpf.trim() || null, genero: m.genero || null },
            especifico: {
                formulario: 'AUTORIZACAO_VIAGEM_MENOR', versao: 1, escopo: 'viagem nacional',
                autorizantes: aut,
                menor: { nome: m.nome.trim(), nacionalidade: nacFinal('menor'), genero: m.genero || null, data_nascimento: m.nasc, idade_no_cadastro: idade,
                    naturalidade: m.nat_tipo === 'Brasil' ? { cidade: m.nat_cidade.trim(), uf: m.nat_uf } : { pais: m.nat_pais.trim(), cidade: m.nat_cidade.trim() || null }, documentos: docs },
                acompanhamento: { tipo: s.acomp_tipo, descricao: s.acomp_desc.trim() || null, acompanhantes: ac, recebedor_no_destino: recebedor,
                    contatos_emergencia: s.acomp_tipo === 'desacompanhado' ? s.emergencia.map(c => ({ nome: c.nome.trim(), parentesco: c.parentesco.trim() || null, telefone: window.Telefone.formatar(c, 'tel') })) : [] },
                viagem: { origem: { cidade: s.viagem.origem_cidade.trim(), uf: s.viagem.origem_uf }, destino: { cidade: s.viagem.destino_cidade.trim(), uf: s.viagem.destino_uf }, saida: s.viagem.saida, retorno: s.viagem.retorno, finalidade: s.viagem.finalidade.trim() || null },
                transporte: { tipo: t.tipo, empresa: t.empresa.trim() || null, companhia: t.companhia.trim() || null, veiculo_do_autorizante: t.proprio_do_autorizante || null, condutor: t.condutor.trim() || null, proprietario: t.proprietario.trim() || null,
                    motorista_carona: t.carona_nome.trim() || null, telefone_motorista: window.Telefone.formatar(t, 'carona_tel') || null, outro: t.outro_desc.trim() || null },
                validade: { tipo: s.validade.tipo, inicio: s.validade.inicio, fim: s.validade.fim, observacoes: s.validade.obs.trim() || null },
                confirmacao: { texto: TEXTO_CONFIRMACAO, aceita: !!s.confirmacao, registrada_em: new Date().toISOString() },
                alertas_conferencia: calcularAlertas(),
                // estado bruto do formulário: garante que a edição reabra exatamente como foi preenchido
                form_state: { s, nac, UID },
            },
        },
    };
}
async function submitForm() {
    const erros = [...errosEtapa1(), ...errosEtapa2(), ...errosEtapa3(), ...errosEtapa4(), ...errosEtapa5()];
    if (erros.length) { showError('Ainda há campos a corrigir: veja a lista acima.'); return; }
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true; btn.textContent = 'Enviando...';
    const registro = montarRegistro();
    if (editMode) { avisarPai({ type: 'form-salvar-pedido', table: 'declaracoes_pendentes', id: editId, registro }); return; }
    const { error } = await supabase.from('declaracoes_pendentes').insert(registro);
    if (error) {
        showError('Não deu pra enviar agora. Tenta de novo em alguns segundos — se persistir, chama a gente pelo WhatsApp.');
        btn.disabled = false; btn.textContent = 'Enviar autorização';
        return;
    }
    limparRascunho();
    document.getElementById('cardArea').innerHTML = `
        <div class="success-box">
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
            <h2>Dados recebidos!</h2>
            <p>Seus dados foram recebidos. Nossa equipe vai conferir as informações e orientar sobre a documentação necessária para o embarque.</p>
        </div>`;
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('stepLabel').textContent = 'Concluído';
}
window.addEventListener('message', (ev) => {
    if (ev.origin !== window.location.origin) return;
    if (!ev.data || ev.data.type !== 'form-salvar-resultado') return;
    const btn = document.getElementById('btnSubmit');
    if (ev.data.ok) {
        document.getElementById('cardArea').innerHTML = `<div class="success-box"><svg class="check" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg><h2>Alterações salvas!</h2><p>A autorização foi atualizada.</p></div>`;
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('stepLabel').textContent = 'Concluído';
    } else {
        showError(ev.data.error || 'Não deu pra salvar agora. Tenta de novo em alguns segundos.');
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar alterações'; }
    }
});

// ---------- Modo de edição (protocolo padrão dos formulários) ----------
function avisarPai(msg) { if (window.parent && window.parent !== window) window.parent.postMessage(msg, window.location.origin); }
function cancelarEdicao() { avisarPai({ type: 'form-editar-cancelado' }); if (window.parent === window) history.back(); }
window.__cancelarEdicao = cancelarEdicao;
async function iniciar() {
    const params = new URLSearchParams(location.search);
    const id = params.get('editId');
    if (!id) {
        const r = lerRascunho();
        if (r) { const d = new Date(r.t); rascunhoOferecido = { quando: d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) }; }
        render(); return;
    }
    editMode = true; editId = id;
    document.getElementById('cardArea').innerHTML = '<p style="color:var(--text-dim); font-size:13px;">Carregando autorização…</p>';
    const { data, error } = await supabase.from('declaracoes_pendentes').select('*').eq('id', id).single();
    const fs = data && data.dados && data.dados.especifico && data.dados.especifico.form_state;
    if (error || !data || data.tipo_contrato !== TIPO || !fs || !fs.s) {
        document.getElementById('cardArea').innerHTML = `<h2>Não foi possível abrir esta autorização</h2><p style="color:var(--text-dim); font-size:13px;">O registro não foi encontrado ou não é desse tipo.</p>`;
        return;
    }
    aplicarEstado(fs.s, fs.nac); UID = Math.max(UID, fs.UID || 0);
    const headerP = document.querySelector('.header p');
    if (headerP) headerP.textContent = 'Corrija os dados abaixo e salve as alterações.';
    render();
}
window.__test = { s, nac, montarRegistro, calcularAlertas, validadores, aplicarEstado, get stepIndex() { return stepIndex; }, set stepIndex(v) { stepIndex = v; }, render, novaPessoa, novoAcomp, ajustarAcompanhantes, idadeEm };
iniciar();
</script>
