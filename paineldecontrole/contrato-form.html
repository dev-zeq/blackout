<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Contrato — Blackout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<style>
    :root {
        --bg: #05170c;
        --surface: #0c1f14;
        --surface-2: #0f2818;
        --border: rgba(255,255,255,0.08);
        --text: #eafff1;
        --text-dim: #8fa89a;
        --text-faint: #5c7568;
        --accent: #22c55e;
        --accent-bright: #4ade80;
        --accent-dim: rgba(34,197,94,0.12);
        --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        background: radial-gradient(circle at 50% 0%, #0a2415 0%, var(--bg) 55%); color: var(--text);
        padding: 24px 16px 60px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 22px; }
    .header .logo { width: 52px; height: 52px; margin: 0 auto 10px; }
    .header h1 { font-size: 19px; margin: 0 0 4px; }
    .header p { font-size: 12.5px; color: var(--text-dim); margin: 0; }
    .progress-track { height: 5px; background: var(--surface); border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); border-radius: 10px; transition: width .25s ease; }
    .step-label { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 18px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 22px 18px; }
    .card h2 { font-size: 15px; margin: 0 0 6px; color: var(--text); }
    .step-sub { font-size: 12.5px; color: var(--text-dim); margin: 0 0 16px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
    .field .hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
    input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number], select, textarea {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--text); font-size: 14.5px; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .radio-group, .check-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .radio-pill { flex: 1 1 auto; min-width: 90px; }
    .radio-pill input { position: absolute; opacity: 0; pointer-events: none; }
    .radio-pill .pill-label {
        display: block; text-align: center; padding: 11px 10px; border-radius: 12px; border: 1px solid var(--border);
        background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; transition: all .12s;
    }
    .radio-pill input:checked + .pill-label { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-bright); }
    .tipo-card { display: block; border: 1px solid var(--border); border-radius: 16px; background: var(--surface-2); padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all .12s; }
    .tipo-card:hover { border-color: rgba(34,197,94,0.4); }
    .tipo-card.selected { border-color: var(--accent); background: var(--accent-dim); }
    .tipo-card .tipo-emoji { font-size: 22px; margin-bottom: 6px; }
    .tipo-card .tipo-title { font-size: 14.5px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .tipo-card .tipo-desc { font-size: 12px; color: var(--text-dim); }
    .nav-row { display: flex; gap: 10px; margin-top: 22px; }
    .btn { flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-next { background: linear-gradient(135deg, var(--accent-bright), var(--accent)); color: #05170c; box-shadow: 0 4px 20px rgba(34,197,94,0.3); }
    .btn-back { background: var(--surface-2); color: var(--text-dim); flex: 0 0 90px; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .error-msg { color: var(--danger); font-size: 12px; margin-top: 10px; display: none; }
    .review-item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
    .review-item .rk { color: var(--text-dim); }
    .review-item .rv { color: var(--text); text-align: right; font-weight: 600; }
    .success-box { text-align: center; padding: 40px 10px; }
    .success-box .check { width: 64px; height: 64px; margin: 0 auto 18px; }
    .success-box h2 { font-size: 18px; margin-bottom: 8px; }
    .success-box p { color: var(--text-dim); font-size: 13.5px; }
    @media (max-width: 380px) { .card { padding: 18px 14px; } }

    /* ---- Ler Documento (piloto: só Locação de Imóvel) ---- */
    .btn-ler-doc {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        width: 100%; padding: 13px; margin-bottom: 18px; border-radius: 14px;
        border: 1px dashed rgba(34,197,94,0.45); background: var(--accent-dim); color: var(--accent-bright);
        font-size: 13.5px; font-weight: 700; cursor: pointer;
    }
    .doc-overlay {
        position: fixed; inset: 0; background: rgba(2,10,5,0.72); backdrop-filter: blur(2px);
        display: flex; align-items: flex-end; justify-content: center; z-index: 100; padding: 0;
    }
    .doc-overlay .doc-sheet {
        width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--border);
        border-radius: 20px 20px 0 0; padding: 22px 18px 26px; max-height: 88vh; overflow-y: auto;
    }
    @media (min-width: 560px) {
        .doc-overlay { align-items: center; }
        .doc-overlay .doc-sheet { border-radius: 20px; max-height: 84vh; }
    }
    .doc-sheet h3 { font-size: 16px; margin: 0 0 4px; }
    .doc-sheet .doc-sub { font-size: 12.5px; color: var(--text-dim); margin: 0 0 18px; }
    .doc-action-btn {
        display: block; width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 14px; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--text); font-size: 14.5px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .doc-action-btn.primary { background: linear-gradient(135deg, var(--accent-bright), var(--accent)); color: #05170c; border: none; }
    .doc-action-btn.cancel { color: var(--text-dim); background: transparent; border: none; margin-bottom: 0; }
    .doc-loading { text-align: center; padding: 30px 10px; color: var(--text-dim); font-size: 14px; }
    .doc-loading .spin {
        width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
        border: 3px solid var(--border); border-top-color: var(--accent); animation: doc-spin 0.8s linear infinite;
    }
    @keyframes doc-spin { to { transform: rotate(360deg); } }
    .doc-erro { text-align: center; padding: 10px; }
    .doc-erro p { color: var(--danger); font-size: 13.5px; margin: 10px 0 20px; }
    .doc-confirma .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
    .doc-confirma .field { margin-bottom: 12px; }
    .doc-confirma .field input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; font-family: inherit; }

    /* Campos de data (flatpickr): sem digitação, cursor de "escolher" e cor do app */
    input[data-role="fp-data"], input[data-doc-campo="data_nascimento"] { cursor: pointer; caret-color: transparent; }
    .flatpickr-day.selected, .flatpickr-day.selected:hover, .flatpickr-day.selected:focus { background: var(--accent); border-color: var(--accent); }
    .flatpickr-day.today { border-color: var(--accent); }
    .flatpickr-months .flatpickr-month, .flatpickr-current-month, .flatpickr-weekdays, span.flatpickr-weekday { background: var(--surface-2); }
    .flatpickr-calendar { background: var(--surface); border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="46" fill="#05170c" stroke="#22C55E" stroke-width="4"/>
            <g fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round">
                <path d="M 50 10 A 40 40 0 1 1 12 60"/>
            </g>
            <polygon points="50,8 42,22 58,22" fill="#22C55E"/>
            <text x="50" y="66" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="white">B</text>
        </svg>
        <h1>Formulário de Contrato</h1>
        <p>Escolha o tipo de contrato e preencha os dados — a gente prepara tudo pra você.</p>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="step-label" id="stepLabel"></div>

    <div class="card" id="cardArea"></div>
</div>

<!-- Ler Documento (piloto Locação de Imóvel): inputs ocultos + overlay compartilhado -->
<input type="file" id="docInputCamera" accept="image/*" capture="environment" style="display:none">
<input type="file" id="docInputGaleria" accept="image/*" style="display:none">
<div id="docOverlay" class="doc-overlay" style="display:none"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import flatpickr from 'https://esm.sh/flatpickr@4.6.13';
import { Portuguese } from 'https://esm.sh/flatpickr@4.6.13/dist/l10n/pt.js';
const SUPABASE_URL = 'https://kihnavaovspdjnegcraj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_h5AITv-_Fjmnq-xC6UC8xg_8CSMLoZK';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pill(name, value, checked, label) {
    const id = name + '_' + value.replace(/\W/g, '');
    return `<label class="radio-pill"><input type="radio" name="${name}" data-key="${name}" id="${id}" value="${esc(value)}" ${checked ? 'checked' : ''}><span class="pill-label" for="${id}">${esc(label || value)}</span></label>`;
}
const ESTADOS_BR = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
function estadoOptions(selected) {
    return ESTADOS_BR.map(u => `<option value="${u}" ${selected === u ? 'selected' : ''}>${u}</option>`).join('');
}

// Campos de data nunca são digitados — no celular abrem o seletor nativo
// (rolagem), no computador abrem o calendário do flatpickr, sempre exibindo
// DD/MM/AAAA (locale Portuguese). O estado interno (`s`) e o que é salvo no
// banco continuam em AAAA-MM-DD (compatível com registros antigos).
function campoDataBR(key, label, obrigatorio) {
    return `<div class="field"><label>${esc(label)}${obrigatorio ? ' *' : ''}</label>
        <input type="text" readonly placeholder="DD/MM/AAAA" data-key="${key}" data-role="fp-data"></div>`;
}
// Inicializa o flatpickr em todo campo de data dentro de `container` — precisa
// ser chamado de novo toda vez que esse pedaço do DOM é recriado (o form
// inteiro é redesenhado via innerHTML a cada passo), senão o clique não abre
// o calendário. `defaultDate` vem do estado `s` pra sobreviver a voltar/avançar
// e ao modo de edição de contrato já salvo.
function inicializarCamposData(container) {
    if (!container) return;
    container.querySelectorAll('[data-role="fp-data"]').forEach(el => {
        const key = el.dataset.key;
        flatpickr(el, {
            locale: Portuguese,
            altInput: true,
            altFormat: 'd/m/Y',
            dateFormat: 'Y-m-d',
            defaultDate: s[key] || undefined,
            allowInput: false,
            onChange: (_datas, dataStr) => { s[key] = dataStr; },
        });
    });
}

// Cidade + bairro selecionáveis (região onde a Blackout atua) — "Outra"/"Outro"
// sempre libera campo livre, pra não travar quem é de fora da região. Usado tanto
// pro endereço de cada pessoa quanto pro endereço do imóvel — por isso os
// campos são todos prefixados (a_, b_, im_) em vez de fixos, ver cidadeField().
const CIDADES_BAIRROS = {
    'Camboriú': ['Areias', 'Cedro', 'Centro', 'Conde Vila Verde', 'Lídia Duarte', 'Monte Alegre', 'Rio Pequeno', 'Santa Regina', 'São Francisco de Assis', 'Tabuleiro', 'Várzea do Ranchinho'],
    'Balneário Camboriú': ['Ariribá', 'Barra', 'Barra Norte', 'Barra Sul', 'Centro', 'Estados', 'Estaleiro', 'Estaleirinho', 'Interpraias', 'Jardim Iate Clube', 'Laranjeiras', 'Municípios', 'Nações', 'Nova Esperança', 'Pioneiros', 'Praia dos Amores', 'São Judas', 'Vila Real'],
    'Itapema': ['Alto do São Bento', 'Andorinha', 'Canto da Praia', 'Casa Branca', 'Castelo Branco', 'Centro', 'Ilhota', 'Meia Praia', 'Morretes', 'Sertãozinho', 'Tabuleiro dos Oliveiras', 'Várzea'],
    'Itajaí': ['Centro', 'Cabeçudas', 'Praia Brava', 'Fazenda', 'Cordeiros', 'São Vicente', 'Barra do Rio', 'Dom Bosco', 'São João', 'Espinheiros', 'Ressacada', 'Salseiros', 'Vila Operária', 'Murta', 'Rio Bonito'],
};
const CIDADES_OPTS = [...Object.keys(CIDADES_BAIRROS), 'Outra'];
// Essas 4 cidades são sempre de SC — o formulário assume o estado sozinho e
// nem pergunta, pra não travar quem não sabe a sigla. Outras cidades (inclusive
// "Outra") continuam pedindo o Estado normalmente.
const CIDADES_SC = ['Camboriú', 'Balneário Camboriú', 'Itapema', 'Itajaí'];
function cidadeOptions(selected) {
    return '<option value="">Selecione</option>' + CIDADES_OPTS.map(c => `<option value="${c}" ${selected === c ? 'selected' : ''}>${c}</option>`).join('');
}
function bairroOptions(cidade, selected) {
    const lista = CIDADES_BAIRROS[cidade] || [];
    return '<option value="">Selecione</option>' + lista.map(b => `<option value="${b}" ${selected === b ? 'selected' : ''}>${b}</option>`).join('') + `<option value="__outro__" ${selected === '__outro__' ? 'selected' : ''}>Outro</option>`;
}

// Campo <select> com opção "Outro" que libera um input de texto livre — usado
// pra manter tudo selecionável (marca, cor, tipo de veículo/imóvel) sem travar
// quem tem um caso fora da lista.
function campoSelecaoComOutro(key, label, opcoes, obrigatorio) {
    const val = s[key];
    return `<div class="field"><label>${esc(label)}${obrigatorio ? ' *' : ''}</label>
        <select data-key="${key}" data-role="select-outro">
            <option value="">Selecione</option>
            ${opcoes.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}
            <option value="Outro" ${val === 'Outro' ? 'selected' : ''}>Outro</option>
        </select>
    </div><div id="cond_${key}"></div>`;
}
function renderCondSelecaoOutro(key) {
    const el = document.getElementById(`cond_${key}`);
    if (!el) return;
    el.innerHTML = s[key] === 'Outro' ? `<div class="field"><label>Qual?</label><input type="text" data-key="${key}_outro" value="${esc(s[key + '_outro'])}"></div>` : '';
}
function valorSelecaoOutro(key) { return s[key] === 'Outro' ? s[key + '_outro'] : s[key]; }

const ANO_ATUAL = new Date().getFullYear();
function anoOptions(selected) {
    let out = '<option value="">Ano</option>';
    for (let y = ANO_ATUAL; y >= ANO_ATUAL - 40; y--) out += `<option value="${y}" ${String(y) === String(selected) ? 'selected' : ''}>${y}</option>`;
    return out;
}
function diaOptions(selected) {
    let out = '<option value="">Dia</option>';
    for (let d = 1; d <= 31; d++) out += `<option value="${d}" ${String(d) === String(selected) ? 'selected' : ''}>${d}</option>`;
    return out;
}

const MARCAS_VEICULO = ['Chevrolet', 'Fiat', 'Ford', 'Volkswagen', 'Honda', 'Toyota', 'Hyundai', 'Renault', 'Nissan', 'Jeep', 'Peugeot', 'Citroën', 'Mitsubishi', 'Kia', 'BMW', 'Mercedes-Benz', 'Audi', 'Yamaha', 'Suzuki', 'Kawasaki'];
const CORES_VEICULO = ['Branco', 'Preto', 'Prata', 'Cinza', 'Vermelho', 'Azul', 'Verde', 'Amarelo', 'Marrom', 'Bege', 'Dourado'];
const TIPOS_VEICULO = ['Carro', 'Moto', 'Caminhonete', 'Caminhão', 'Van/Utilitário', 'Ônibus'];
const TIPOS_IMOVEL = ['Casa', 'Apartamento', 'Terreno', 'Sala Comercial', 'Kitnet/Studio', 'Chácara/Sítio', 'Galpão'];

// ---------- Estado ----------
const s = {
    tipo: '', // 'veiculo_cv' | 'imovel_cv' | 'imovel_locacao'

    a_nome: '', a_cpf: '', a_rg: '', a_genero: '', a_nacionalidade: 'Brasileiro(a)', a_nacionalidade_outro: '', a_estado_civil: '', a_profissao: '',
    a_rua: '', a_numero: '', a_complemento: '', a_cidade: '', a_cidade_outra: '', a_bairro: '', a_bairro_outro: '', a_estado: '',
    a_nascimento: '', a_orgao_emissor: '', a_uf_emissor: '', // só usados no piloto "Ler Documento" (Locação de Imóvel)

    b_nome: '', b_cpf: '', b_rg: '', b_genero: '', b_nacionalidade: 'Brasileiro(a)', b_nacionalidade_outro: '', b_estado_civil: '', b_profissao: '',
    b_rua: '', b_numero: '', b_complemento: '', b_cidade: '', b_cidade_outra: '', b_bairro: '', b_bairro_outro: '', b_estado: '',
    b_nascimento: '', b_orgao_emissor: '', b_uf_emissor: '',

    v_tipo_veiculo: '', v_tipo_veiculo_outro: '', v_fabricante: '', v_fabricante_outro: '', v_modelo: '',
    v_ano_fabricacao: '', v_ano_modelo: '', v_chassi: '', v_cor: '', v_cor_outro: '', v_placa: '', v_renavam: '',

    im_tipo_imovel: '', im_tipo_imovel_outro: '', im_finalidade: 'Residenciais',
    im_rua: '', im_numero: '', im_complemento: '', im_cidade: '', im_cidade_outra: '', im_bairro: '', im_bairro_outro: '', im_estado: '',
    im_area: '', im_terreno_frente: '', im_terreno_fundo: '', im_matricula: '', im_cartorio: '',

    forma_pagamento: '', valor_total: '', teve_dinheiro_entrada: '', valor_entrada: '', num_parcelas: '', data_primeira_parcela: '',

    entrada_veiculo: '', // 'Sim' | 'Não' — houve veículo dado como parte do pagamento (troca)
    ev_tipo_veiculo: '', ev_tipo_veiculo_outro: '', ev_fabricante: '', ev_fabricante_outro: '', ev_modelo: '',
    ev_ano_fabricacao: '', ev_ano_modelo: '', ev_cor: '', ev_cor_outro: '', ev_placa: '', ev_chassi: '', ev_renavam: '', ev_valor: '',

    valor_aluguel: '', dia_vencimento: '', prazo_meses: '', data_inicio: '',
    pagamento_agua: '', pagamento_energia: '', permite_animais: '', max_moradores: '',
    garantia: '', valor_caucao: '', fiador_nome: '', fiador_cpf: '',

    tem_testemunhas: '', // 'Sim' | 'Não'
    test1_nome: '', test1_cpf: '', test2_nome: '', test2_cpf: '',
};

// Terreno pede frente/fundo em vez de área direta — o m² total é calculado
// sozinho (frente × fundo) e só aparece somado no contrato, igual na planilha.
function terrenoAreaTexto() {
    const area = (Number(s.im_terreno_frente) || 0) * (Number(s.im_terreno_fundo) || 0);
    return area ? area.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' m²' : '—';
}
function areaImovelFinal() {
    if (valorSelecaoOutro('im_tipo_imovel') !== 'Terreno') return null;
    const frente = Number(s.im_terreno_frente) || 0, fundo = Number(s.im_terreno_fundo) || 0;
    return (frente && fundo) ? frente * fundo : null;
}
// Metragem só faz sentido pra Terreno (frente × fundo vira a área) — outros
// tipos de imóvel (casa, apartamento...) não pedem nenhum campo de área.
function condAreaImovelHtml() {
    if (valorSelecaoOutro('im_tipo_imovel') !== 'Terreno') return '';
    return `
    <div class="field"><label>Metros de frente *</label><input type="number" step="0.01" data-key="im_terreno_frente" data-role="terreno-medida" value="${esc(s.im_terreno_frente)}"></div>
    <div class="field"><label>Metros de fundo (profundidade) *</label><input type="number" step="0.01" data-key="im_terreno_fundo" data-role="terreno-medida" value="${esc(s.im_terreno_fundo)}"></div>
    <div class="field"><label>Área total (calculada automaticamente)</label><input type="text" id="terrenoAreaDisplay" value="${terrenoAreaTexto()}" disabled style="opacity:.7;"></div>`;
}
function renderCondAreaImovel() {
    const el = document.getElementById('condAreaImovel');
    if (!el) return;
    el.innerHTML = condAreaImovelHtml();
}

function cidadeFinal(p) { return s[p + '_cidade'] === 'Outra' ? s[p + '_cidade_outra'] : s[p + '_cidade']; }
function bairroFinal(p) { return (s[p + '_cidade'] === 'Outra' || s[p + '_bairro'] === '__outro__') ? s[p + '_bairro_outro'] : s[p + '_bairro']; }
function nacionalidadeFinal(p) { return s[p + '_nacionalidade'] === 'Outra' ? s[p + '_nacionalidade_outro'] : s[p + '_nacionalidade']; }
// Rua/Número/Complemento entram separados (evita gente colando tudo junto ou
// esquecendo o número) e são compostos num endereço só na hora de enviar/exibir.
function enderecoFinal(p) {
    const rua = (s[p + '_rua'] || '').trim();
    const numero = (s[p + '_numero'] || '').trim();
    const complemento = (s[p + '_complemento'] || '').trim();
    if (!rua && !numero) return '';
    let out = rua;
    if (numero) out += (out ? ', nº ' : 'nº ') + numero;
    if (complemento) out += ', ' + complemento;
    return out;
}

// Redimensiona/comprime no <canvas> (API nativa, sem lib nova) antes de mandar
// pra IA — reduz custo/latência e o tamanho do payload da Edge Function.
function comprimirImagem(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const maxLado = 1600;
            let { width, height } = img;
            if (width > maxLado || height > maxLado) {
                const escala = maxLado / Math.max(width, height);
                width = Math.round(width * escala); height = Math.round(height * escala);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            URL.revokeObjectURL(url);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não foi possível abrir a imagem.')); };
        img.src = url;
    });
}

async function processarImagemDocumento(file) {
    if (!file || !docAlvo) return;
    const p = docAlvo;
    const papel = p === 'a' ? 'LOCADOR' : 'LOCATÁRIO';
    mostrarDocCarregando();
    let imagem_base64;
    try {
        imagem_base64 = await comprimirImagem(file);
    } catch {
        mostrarDocErro('Não foi possível abrir essa imagem. Tenta outra ou preencha manualmente.');
        return;
    }
    const { data, error } = await supabase.functions.invoke('documento-ia', { body: { imagem_base64, papel } });
    imagem_base64 = null; // descarta a referência assim que a chamada termina
    if (docAlvo !== p) return; // usuário fechou/cancelou enquanto a IA respondia
    if (error || !data) {
        mostrarDocErro('Não foi possível ler agora. Tenta de novo ou preencha manualmente.');
        return;
    }
    if (!data.legivel) {
        mostrarDocErro(data.motivo_nao_legivel || null);
        return;
    }
    mostrarDocConfirmacao(data.dados);
}

let stepIndex = 0;
let steps = [];

function buildSteps() {
    const t = s.tipo;
    const S = { tipo: stepTipo };
    if (!t) { steps = [S.tipo]; return; }
    if (t === 'veiculo_cv') {
        steps = [stepTipo, () => stepPessoa('a', 'VENDEDOR', 'Dados de quem está vendendo o veículo.'), () => stepPessoa('b', 'COMPRADOR', 'Dados de quem está comprando o veículo.'), stepVeiculo, stepPagamento, stepEntrada, stepTestemunhas, stepRevisao];
    } else if (t === 'imovel_cv') {
        steps = [stepTipo, () => stepPessoa('a', 'VENDEDOR', 'Dados de quem está vendendo o imóvel.'), () => stepPessoa('b', 'COMPRADOR', 'Dados de quem está comprando o imóvel.'), stepImovelCV, stepPagamento, stepEntrada, stepTestemunhas, stepRevisao];
    } else if (t === 'imovel_locacao') {
        // Etapa de finalidade (residencial × comercial) entra entre Locador e
        // Locatário — a resposta muda se o Locatário a seguir pede endereço
        // próprio ou não (ver locatarioSemEnderecoProprio()). Como isso desloca
        // a posição do Locatário no array, as duas etapas de pessoa aqui
        // precisam de `.__key` explícito (stepKey() não pode mais inferir pela
        // posição fixa 1/2, que só vale pros outros dois tipos de contrato).
        const passoLocador = () => stepPessoa('a', 'LOCADOR', 'Dados de quem está alugando o imóvel (proprietário).');
        passoLocador.__key = 'pessoaA';
        const passoFinalidade = () => stepFinalidadeLocacao();
        passoFinalidade.__key = 'finalidadeLocacao';
        const passoLocatario = () => stepPessoa('b', 'LOCATÁRIO', 'Dados de quem vai morar/ocupar o imóvel.');
        passoLocatario.__key = 'pessoaB';
        steps = [stepTipo, passoLocador, passoFinalidade, passoLocatario, stepImovelLocacao, stepCondicoesLocacao, stepGarantia, stepTestemunhas, stepRevisao];
    }
}

function render() {
    const total = steps.length;
    document.getElementById('progressFill').style.width = (total > 1 ? Math.round((stepIndex / (total - 1)) * 100) : 0) + '%';
    document.getElementById('stepLabel').textContent = total > 1 ? `Etapa ${stepIndex + 1} de ${total}` : 'Comece por aqui';
    const card = document.getElementById('cardArea');
    card.innerHTML = steps[stepIndex]();
    afterRenderStep();
}

function afterRenderStep() {
    const key = stepKey();
    if (key === 'pessoaA') { renderCondCidade('a'); renderCondNacionalidade('a'); renderCondEstado('a'); inicializarCamposData(document.getElementById('cardArea')); }
    if (key === 'pessoaB') { renderCondCidade('b'); renderCondNacionalidade('b'); renderCondEstado('b'); inicializarCamposData(document.getElementById('cardArea')); }
    if (key === 'veiculo') { ['v_tipo_veiculo', 'v_fabricante', 'v_cor'].forEach(renderCondSelecaoOutro); }
    if (key === 'imovel') { renderCondCidade('im'); renderCondSelecaoOutro('im_tipo_imovel'); renderCondAreaImovel(); renderCondEstado('im'); }
    if (key === 'entrada') renderCondEntradaVeiculo(); // já chama inicializarCamposData internamente, escopado no #condEntrada
    if (key === 'locacao') inicializarCamposData(document.getElementById('cardArea'));
    if (key === 'garantia') renderCondGarantia();
    if (key === 'testemunhas') renderCondTestemunhas();
}

// Identifica a etapa atual por "tipo" lógico (independe do índice, que muda
// conforme o tipo de contrato escolhido) — usado por afterRenderStep,
// validateCurrentStep e saveCurrentStep pra saber o que fazer.
function stepKey() {
    const fn = steps[stepIndex];
    return fn.__key || (fn === stepTipo ? 'tipo' : fn === stepVeiculo ? 'veiculo' : fn === stepImovelCV || fn === stepImovelLocacao ? 'imovel'
        : fn === stepPagamento ? 'pagamento' : fn === stepEntrada ? 'entrada' : fn === stepCondicoesLocacao ? 'locacao' : fn === stepGarantia ? 'garantia'
        : fn === stepTestemunhas ? 'testemunhas' : fn === stepRevisao ? 'revisao' : (stepIndex === 1 ? 'pessoaA' : stepIndex === 2 ? 'pessoaB' : ''));
}

function goNext() {
    saveCurrentStep();
    const err = validateCurrentStep();
    if (err) { showError(err); return; }
    if (stepIndex < steps.length - 1) { stepIndex++; render(); window.scrollTo(0, 0); }
}
// No modo de edição a etapa 0 (escolha do tipo) fica pulada de propósito —
// trocar o tipo no meio de uma edição bagunçaria os campos já carregados,
// e não foi pedido. Por isso Voltar não passa da etapa 1 (primeira pessoa).
function goBack() { if (stepIndex > (editMode ? 1 : 0)) { stepIndex--; render(); window.scrollTo(0, 0); } }
function showError(msg) {
    const el = document.getElementById('errorMsg');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
}
window.__goNext = goNext;
window.__goBack = goBack;

// Valor restante a prazo, descontando entrada em dinheiro (se houver) e o
// veículo dado na troca (se houver) — mesma conta que o painel faz na hora
// de montar o contrato, usada aqui só pra mostrar a prévia da parcela.
function valorRestanteAPagar() {
    const total = Number(s.valor_total) || 0;
    const dinheiro = s.teve_dinheiro_entrada === 'Sim' ? (Number(s.valor_entrada) || 0) : 0;
    const veiculo = s.entrada_veiculo === 'Sim' ? (Number(s.ev_valor) || 0) : 0;
    return Math.max(total - dinheiro - veiculo, 0);
}
// Parcelas sempre em reais fechados (sem centavos) — arredondado pra baixo,
// igual o painel faz na hora de gerar o contrato final.
function valorParcelaTexto() {
    const n = Number(s.num_parcelas) || 0;
    if (!n) return '—';
    const parcela = Math.floor(valorRestanteAPagar() / n);
    return parcela.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function renderCondEntradaDinheiroParcelas() {
    const el = document.getElementById('condEntradaDinheiroParcelas');
    if (!el) return;
    if (!s.entrada_veiculo) { el.innerHTML = ''; return; }
    let html = '';
    const labelDinheiro = s.entrada_veiculo === 'Sim'
        ? (s.forma_pagamento === 'Prazo' ? 'Além do veículo, teve valor em dinheiro na entrada?' : 'Além do veículo, teve valor em dinheiro pago no ato?')
        : 'Teve valor de entrada em dinheiro?';
    if (s.forma_pagamento === 'Prazo' || s.entrada_veiculo === 'Sim') {
        html += `<div class="field"><label>${esc(labelDinheiro)}</label>
            <div class="radio-group">${pill('teve_dinheiro_entrada', 'Sim', s.teve_dinheiro_entrada === 'Sim')}${pill('teve_dinheiro_entrada', 'Não', s.teve_dinheiro_entrada === 'Não')}</div>
        </div><div id="condValorEntradaDinheiro"></div>`;
    }
    if (s.forma_pagamento === 'Prazo') {
        html += `<div class="field"><label>Número de parcelas *</label><input type="number" min="1" data-key="num_parcelas" value="${esc(s.num_parcelas)}"></div>`;
        html += `<div class="field"><label>Valor de cada parcela (calculado automaticamente)</label><input type="text" id="parcelaValorDisplay" value="${valorParcelaTexto()}" disabled style="opacity:.7;"></div>`;
        html += campoDataBR('data_primeira_parcela', 'Data da primeira parcela', true);
    }
    el.innerHTML = html;
    inicializarCamposData(el);
    renderCondValorEntradaDinheiro();
}
function renderCondValorEntradaDinheiro() {
    const el = document.getElementById('condValorEntradaDinheiro');

    if (s.teve_dinheiro_entrada !== 'Sim') { s.valor_entrada = ''; el.innerHTML = ''; return; }
    el.innerHTML = `<div class="field"><label>Qual o valor em dinheiro da entrada?</label><input type="number" step="0.01" data-key="valor_entrada" value="${esc(s.valor_entrada)}"></div>`;

// ---------- Validação ----------
function validarPessoa(p) {
    if (!s[p + '_nome'] || !s[p + '_cpf'] || !s[p + '_genero'] || !nacionalidadeFinal(p)) {
        return 'Preencha todos os campos obrigatórios (*).';
    }
    // Locatário em locação residencial não tem campo de endereço próprio pra
    // validar — ver locatarioSemEnderecoProprio() e stepPessoa().
    if (p === 'b' && locatarioSemEnderecoProprio()) return null;
    if (!s[p + '_rua'] || !s[p + '_numero'] || !cidadeFinal(p) || !bairroFinal(p) || !estadoFinal(p)) {
        return 'Preencha todos os campos obrigatórios (*).';
    }
    return null;
}
function validateCurrentStep() {
    const key = stepKey();
    switch (key) {
        case 'tipo': return s.tipo ? null : 'Escolha o tipo de contrato pra continuar.';
        case 'pessoaA': return validarPessoa('a');
        case 'finalidadeLocacao': return s.im_finalidade ? null : 'Selecione se a locação é residencial ou comercial.';
        case 'pessoaB': return validarPessoa('b');
        case 'veiculo':
            if (!valorSelecaoOutro('v_tipo_veiculo') || !valorSelecaoOutro('v_fabricante') || !s.v_modelo || !s.v_placa) return 'Preencha todos os campos obrigatórios (*).';
            return null;
        case 'imovel':
            if (!valorSelecaoOutro('im_tipo_imovel') || !s.im_rua || !s.im_numero || !cidadeFinal('im') || !bairroFinal('im') || !estadoFinal('im')) return 'Preencha todos os campos obrigatórios (*).';
            if (s.tipo === 'imovel_cv' && valorSelecaoOutro('im_tipo_imovel') === 'Terreno' && (!s.im_terreno_frente || !s.im_terreno_fundo)) return 'Informe os metros de frente e de fundo do terreno.';
            return null;
        case 'pagamento':
            if (!s.forma_pagamento || !s.valor_total) return 'Preencha todos os campos obrigatórios (*).';
            return null;
        case 'entrada':
            if (!s.entrada_veiculo) return 'Responda se teve veículo entrando na negociação.';
            if (s.entrada_veiculo === 'Sim' && (!valorSelecaoOutro('ev_tipo_veiculo') || !valorSelecaoOutro('ev_fabricante') || !s.ev_placa || !s.ev_valor)) return 'Preencha os dados do veículo dado na entrada.';
            if ((s.forma_pagamento === 'Prazo' || s.entrada_veiculo === 'Sim') && !s.teve_dinheiro_entrada) return 'Responda se teve valor em dinheiro na entrada.';
            if (s.teve_dinheiro_entrada === 'Sim' && !s.valor_entrada) return 'Informe o valor em dinheiro da entrada.';
            if (s.forma_pagamento === 'Prazo' && (!s.num_parcelas || !s.data_primeira_parcela)) return 'Preencha o número de parcelas e a data da primeira parcela.';
            return null;
        case 'locacao':
            if (!s.valor_aluguel || !s.dia_vencimento || !s.prazo_meses || !s.data_inicio) return 'Preencha todos os campos obrigatórios (*).';
            if (!s.pagamento_agua || !s.pagamento_energia) return 'Informe quem paga água e energia elétrica.';
            if (!s.permite_animais) return 'Responda se o imóvel permite animais de estimação.';
            if (s.im_finalidade === 'Residenciais' && !s.max_moradores) return 'Informe a quantidade máxima de moradores autorizados.';
            return null;
        case 'garantia':
            if (!s.garantia) return 'Selecione o tipo de garantia.';
            if (s.garantia === 'Caução' && !s.valor_caucao) return 'Informe o valor da caução.';
            if (s.garantia === 'Fiador' && (!s.fiador_nome || !s.fiador_cpf)) return 'Preencha os dados do fiador.';
            return null;
        case 'testemunhas':
            return s.tem_testemunhas ? null : 'Responda se gostaria de adicionar testemunhas.';
        default: return null;
    }
}
function saveCurrentStep() {
    if (stepKey() === 'tipo') return; // já salvo no clique do card
}

// ---------- Delegação de eventos (form todo dirigido por data-key) ----------
const cardEl = document.getElementById('cardArea');
cardEl.addEventListener('input', e => {
    const key = e.target.dataset.key;
    // Campos de data (flatpickr) são só-leitura e cuidam de `s[key]` sozinhos
    // via onChange (ver inicializarCamposData) — nada a fazer aqui.
    if (e.target.dataset.role === 'fp-data') return;
    if (key && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') && e.target.type !== 'radio') {
        s[key] = e.target.value;
    }
    if (e.target.dataset.role === 'terreno-medida') {
        const disp = document.getElementById('terrenoAreaDisplay');
        if (disp) disp.value = terrenoAreaTexto();
    }
    if (key === 'num_parcelas' || key === 'valor_entrada') {
        const disp = document.getElementById('parcelaValorDisplay');
        if (disp) disp.value = valorParcelaTexto();
    }
});
cardEl.addEventListener('change', e => {
    const t = e.target;
    const key = t.dataset.key;
    if (!key) return;
    if (t.type === 'radio') { s[key] = t.value; }
    else if (t.tagName === 'SELECT') { s[key] = t.value; }
    if (t.dataset.role === 'cidade') {
        const p = t.dataset.prefix;
        s[p + '_bairro'] = ''; s[p + '_bairro_outro'] = '';
        s[p + '_estado'] = estadoForcadoSC(p) ? 'SC' : '';
        renderCondCidade(p);
        renderCondEstado(p);
    }
    if (t.dataset.role === 'bairro') {
        const p = t.dataset.prefix;
        renderCondBairroOutro(p);
    }
    if (t.dataset.role === 'select-outro') { renderCondSelecaoOutro(key); if (key === 'im_tipo_imovel') renderCondAreaImovel(); }
    if (t.type === 'radio' && (key === 'a_nacionalidade' || key === 'b_nacionalidade')) { renderCondNacionalidade(key.slice(0, 1)); }
    if (t.dataset.role === 'garantia') { renderCondGarantia(); }
    if (key === 'entrada_veiculo') { renderCondEntradaVeiculo(); }
    if (key === 'teve_dinheiro_entrada') { renderCondValorEntradaDinheiro(); const disp = document.getElementById('parcelaValorDisplay'); if (disp) disp.value = valorParcelaTexto(); }
    if (key === 'tem_testemunhas') { renderCondTestemunhas(); }
});
cardEl.addEventListener('click', e => {
    const lerDocBtn = e.target.closest('[data-action="ler-documento"]');
    if (lerDocBtn) {
        const p = lerDocBtn.dataset.pessoa;
        abrirLeituraDocumento(p, p === 'a' ? 'LOCADOR' : 'LOCATÁRIO');
        return;
    }
    const card = e.target.closest('[data-tipo-choice]');
    if (card) {
        s.tipo = card.dataset.tipoChoice;
        buildSteps();
        document.querySelectorAll('.tipo-card').forEach(c => c.classList.toggle('selected', c === card));
    }
    if (e.target.id === 'btnSubmit') submitForm();
});

// ---------- Envio ----------
async function submitForm() {
    if (editMode && !confirm('Deseja salvar as alterações feitas neste contrato?')) return;
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true; btn.textContent = editMode ? 'Salvando...' : 'Enviando...';

    // rua/numero/complemento salvos soltos (além do endereco já composto) só
    // pra dar pra recarregar certinho no modo de edição — ver carregarParaEdicao().
    const pessoa = p => {
        // Locatário em locação residencial não preenche endereço próprio — o
        // endereço dele no contrato é o do próprio imóvel alugado (ver
        // locatarioSemEnderecoProprio()/stepPessoa()). `enderecoFinal` e as
        // outras funções `*Final` são genéricas por prefixo, então funcionam
        // igual passando 'im' no lugar de 'a'/'b'.
        const pref = (p === 'b' && locatarioSemEnderecoProprio()) ? 'im' : p;
        return {
            nome: s[p + '_nome'], cpf: s[p + '_cpf'], rg: s[p + '_rg'] || null, genero: s[p + '_genero'],
            nacionalidade: nacionalidadeFinal(p), estado_civil: s[p + '_estado_civil'] || null, profissao: s[p + '_profissao'] || null,
            endereco: enderecoFinal(pref), rua: s[pref + '_rua'] || null, numero: s[pref + '_numero'] || null, complemento: s[pref + '_complemento'] || null,
            bairro: bairroFinal(pref), cidade: cidadeFinal(pref), estado: estadoFinal(pref),
            // Só preenchidos hoje via "Ler Documento" (piloto Locação de Imóvel) —
            // ficam null pros outros tipos de contrato, que não têm essa UI.
            nascimento: s[p + '_nascimento'] || null, orgao_emissor: s[p + '_orgao_emissor'] || null, uf_emissor: s[p + '_uf_emissor'] || null,
        };
    };
    const anoFabricacaoModelo = (fab, mod) => {
        if (!fab) return null;
        return mod && mod !== fab ? `${fab}/${mod}` : `${fab}/${fab}`;
    };
    const veiculoEntrada = () => {
        if (s.entrada_veiculo !== 'Sim') return null;
        return {
            tipo_veiculo: valorSelecaoOutro('ev_tipo_veiculo'), fabricante: valorSelecaoOutro('ev_fabricante'), modelo: s.ev_modelo,
            ano_fabricacao_modelo: anoFabricacaoModelo(s.ev_ano_fabricacao, s.ev_ano_modelo), cor: valorSelecaoOutro('ev_cor') || null,
            placa: s.ev_placa, chassi: s.ev_chassi || null, renavam: s.ev_renavam || null,
            valor: Number(s.ev_valor) || 0,
        };
    };

    const temTestemunhas = s.tem_testemunhas === 'Sim';
    let tipo_contrato = '';
    // tem_testemunhas/teve_dinheiro_entrada/entrada_veiculo salvos explícitos
    // (além dos valores derivados de cada um) só pra dar pra recarregar as
    // perguntas SIM/NÃO certinho no modo de edição — ver carregarParaEdicao().
    let especifico = {
        tem_testemunhas: s.tem_testemunhas || 'Não',
        testemunha_1_nome: temTestemunhas ? (s.test1_nome || null) : null, testemunha_1_cpf: temTestemunhas ? (s.test1_cpf || null) : null,
        testemunha_2_nome: temTestemunhas ? (s.test2_nome || null) : null, testemunha_2_cpf: temTestemunhas ? (s.test2_cpf || null) : null,
    };

    if (s.tipo === 'veiculo_cv') {
        tipo_contrato = 'CONTRATO_CV_VEICULO';
        especifico = {
            ...especifico,
            tipo_veiculo: valorSelecaoOutro('v_tipo_veiculo'), fabricante: valorSelecaoOutro('v_fabricante'), modelo: s.v_modelo,
            ano_fabricacao_modelo: anoFabricacaoModelo(s.v_ano_fabricacao, s.v_ano_modelo), cor: valorSelecaoOutro('v_cor') || null, placa: s.v_placa,
            chassi: s.v_chassi || null, renavam: s.v_renavam || null,
            forma_pagamento: s.forma_pagamento, valor_total: Number(s.valor_total) || 0,
            entrada_veiculo: s.entrada_veiculo || 'Não',
            veiculo_entrada: veiculoEntrada(),
            teve_dinheiro_entrada: s.teve_dinheiro_entrada || 'Não',
            valor_entrada: s.valor_entrada ? Number(s.valor_entrada) : 0,
            num_parcelas: s.num_parcelas ? Number(s.num_parcelas) : null,
            data_primeira_parcela: s.data_primeira_parcela || null,
        };
    } else if (s.tipo === 'imovel_cv') {
        tipo_contrato = 'CONTRATO_CV_IMOVEL';
        especifico = {
            ...especifico,
            tipo_imovel: valorSelecaoOutro('im_tipo_imovel'), endereco_imovel: enderecoFinal('im'),
            rua_imovel: s.im_rua || null, numero_imovel: s.im_numero || null, complemento_imovel: s.im_complemento || null,
            bairro_imovel: bairroFinal('im'), cidade_imovel: cidadeFinal('im'), estado_imovel: estadoFinal('im'),
            area_m2: areaImovelFinal(),
            frente_m: valorSelecaoOutro('im_tipo_imovel') === 'Terreno' ? (Number(s.im_terreno_frente) || null) : null,
            fundos_m: valorSelecaoOutro('im_tipo_imovel') === 'Terreno' ? (Number(s.im_terreno_fundo) || null) : null,
            matricula: s.im_matricula || null, cartorio: s.im_cartorio || null,
            forma_pagamento: s.forma_pagamento, valor_total: Number(s.valor_total) || 0,
            entrada_veiculo: s.entrada_veiculo || 'Não',
            veiculo_entrada: veiculoEntrada(),
            teve_dinheiro_entrada: s.teve_dinheiro_entrada || 'Não',
            valor_entrada: s.valor_entrada ? Number(s.valor_entrada) : 0,
            num_parcelas: s.num_parcelas ? Number(s.num_parcelas) : null,
            data_primeira_parcela: s.data_primeira_parcela || null,
        };
    } else if (s.tipo === 'imovel_locacao') {
        tipo_contrato = 'CONTRATO_LOCACAO_IMOVEL';
        especifico = {
            ...especifico,
            tipo_imovel: valorSelecaoOutro('im_tipo_imovel'), finalidade: s.im_finalidade,
            endereco_imovel: enderecoFinal('im'),
            rua_imovel: s.im_rua || null, numero_imovel: s.im_numero || null, complemento_imovel: s.im_complemento || null,
            bairro_imovel: bairroFinal('im'), cidade_imovel: cidadeFinal('im'), estado_imovel: estadoFinal('im'),
            valor_aluguel: Number(s.valor_aluguel) || 0, dia_vencimento: Number(s.dia_vencimento) || null,
            prazo_meses: Number(s.prazo_meses) || null, data_inicio: s.data_inicio || null,
            pagamento_agua: s.pagamento_agua || 'LOCATÁRIA', pagamento_energia: s.pagamento_energia || 'LOCATÁRIA',
            permite_animais: s.permite_animais || 'Não',
            // Só se aplica (e só é pedido no formulário) em locação residencial —
            // ver stepCondicoesLocacao(). Fica null em locação comercial.
            max_moradores: s.im_finalidade === 'Residenciais' ? (Number(s.max_moradores) || null) : null,
            garantia: s.garantia, valor_caucao: s.valor_caucao ? Number(s.valor_caucao) : null,
            fiador_nome: s.fiador_nome || null, fiador_cpf: s.fiador_cpf || null,
        };
    }

    const registro = {
        tipo_contrato,
        dados: { pessoa_a: pessoa('a'), pessoa_b: pessoa('b'), especifico },
    };

    if (editMode) {
        // O formulário público não tem (e não deve ter) a senha de escrita da
        // equipe — só o painel (index.html) tem, depois de desbloqueado. Por
        // isso quem grava a edição é o painel: a gente só manda os dados
        // prontos e espera a resposta (ver window.addEventListener('message')
        // logo abaixo e o listener equivalente em index.html/abrirEdicaoContrato).
        avisarPai({ type: 'contrato-salvar-pedido', id: editId, registro });
        return;
    }

    const { error } = await supabase.from('declaracoes_pendentes').insert(registro);
    if (error) {
        showError('Não deu pra enviar agora. Tenta de novo em alguns segundos — se persistir, chama a gente pelo WhatsApp.');
        btn.disabled = false; btn.textContent = 'Enviar contrato';
        return;
    }
    document.getElementById('cardArea').innerHTML = `
        <div class="success-box">
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>
            <h2>Contrato enviado!</h2>
            <p>Recebemos as informações. A equipe da Blackout vai preparar o contrato pra assinatura.</p>
        </div>`;
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('stepLabel').textContent = 'Concluído';
}
// Resposta do painel ao pedido de salvar (contrato-salvar-pedido) — só existe
// quando o formulário está embutido no iframe de edição do painel.
window.addEventListener('message', (ev) => {
    if (ev.origin !== window.location.origin) return;
    if (!ev.data || ev.data.type !== 'contrato-salvar-resultado') return;
    const btn = document.getElementById('btnSubmit');
    if (ev.data.ok) {
        document.getElementById('cardArea').innerHTML = `
            <div class="success-box">
                <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>
                <h2>Alterações salvas!</h2>
                <p>O contrato foi atualizado.</p>
            </div>`;
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('stepLabel').textContent = 'Concluído';
    } else {
        showError(ev.data.error || 'Não deu pra salvar agora. Tenta de novo em alguns segundos — se persistir, chama a gente pelo WhatsApp.');
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar alterações'; }
    }
});

// ---------- Modo de edição (reabre o formulário já preenchido a partir de um
// registro existente em declaracoes_pendentes, pra corrigir sem duplicar) ----------
let editMode = false;
let editId = null;

// Quando aberto dentro do iframe do painel (index.html), avisa o pai que
// salvou/cancelou — o painel escuta isso e fecha o modal/re-formata sozinho.
// Fora do iframe (link aberto direto) isso é um no-op inofensivo.
function avisarPai(msg) {
    if (window.parent && window.parent !== window) window.parent.postMessage(msg, window.location.origin);
}
function cancelarEdicao() {
    avisarPai({ type: 'contrato-editar-cancelado' });
    if (window.parent === window) history.back();
}
window.__cancelarEdicao = cancelarEdicao;

// Acha o valor "final" de um campo com opção Outro/Outra dentro de uma lista
// de opções conhecidas — se não estiver na lista, joga em Outro/Outra +
// campo livre. É o caminho inverso de valorSelecaoOutro()/cidadeFinal() etc,
// usado só na hora de recarregar um registro salvo pra edição.
function paraSelecaoOutro(valor, opcoes) {
    if (!valor) return { valor: '', outro: '' };
    return opcoes.includes(valor) ? { valor, outro: '' } : { valor: 'Outro', outro: valor };
}
function carregarCidadeBairro(p, cidadeSalva, bairroSalvo) {
    if (cidadeSalva && CIDADES_OPTS.includes(cidadeSalva) && cidadeSalva !== 'Outra') {
        s[p + '_cidade'] = cidadeSalva;
        const lista = CIDADES_BAIRROS[cidadeSalva] || [];
        if (bairroSalvo && lista.includes(bairroSalvo)) { s[p + '_bairro'] = bairroSalvo; }
        else { s[p + '_bairro'] = '__outro__'; s[p + '_bairro_outro'] = bairroSalvo || ''; }
    } else {
        s[p + '_cidade'] = cidadeSalva ? 'Outra' : '';
        s[p + '_cidade_outra'] = cidadeSalva || '';
        s[p + '_bairro_outro'] = bairroSalvo || '';
    }
}
function carregarEnderecoSolto(p, rua, numero, complemento, enderecoComposto) {
    if (rua || numero || complemento) {
        s[p + '_rua'] = rua || ''; s[p + '_numero'] = numero || ''; s[p + '_complemento'] = complemento || '';
    } else if (enderecoComposto) {
        // Registro salvo antes dessa versão do formulário — só tinha o
        // endereço já junto. Não dá pra separar com segurança, então joga
        // tudo em "Rua" e deixa Número/Complemento em branco pro usuário ajustar.
        s[p + '_rua'] = enderecoComposto; s[p + '_numero'] = ''; s[p + '_complemento'] = '';
    }
}
function carregarPessoa(p, pes) {
    if (!pes) return;
    s[p + '_nome'] = pes.nome || ''; s[p + '_cpf'] = pes.cpf || ''; s[p + '_rg'] = pes.rg || '';
    s[p + '_genero'] = pes.genero || ''; s[p + '_estado_civil'] = pes.estado_civil || ''; s[p + '_profissao'] = pes.profissao || '';
    const nac = paraSelecaoOutro(pes.nacionalidade, ['Brasileiro(a)', 'Venezuelano(a)', 'Haitiano(a)']);
    s[p + '_nacionalidade'] = nac.valor === 'Outro' ? 'Outra' : (nac.valor || 'Brasileiro(a)');
    s[p + '_nacionalidade_outro'] = nac.outro;
    carregarEnderecoSolto(p, pes.rua, pes.numero, pes.complemento, pes.endereco);
    carregarCidadeBairro(p, pes.cidade, pes.bairro);
    s[p + '_estado'] = pes.estado || '';
    s[p + '_nascimento'] = pes.nascimento || ''; s[p + '_orgao_emissor'] = pes.orgao_emissor || ''; s[p + '_uf_emissor'] = pes.uf_emissor || '';
}
function carregarVeiculo(prefixo, v) {
    if (!v) return;
    const tv = paraSelecaoOutro(v.tipo_veiculo, TIPOS_VEICULO);
    s[prefixo + '_tipo_veiculo'] = tv.valor; s[prefixo + '_tipo_veiculo_outro'] = tv.outro;
    const fab = paraSelecaoOutro(v.fabricante, MARCAS_VEICULO);
    s[prefixo + '_fabricante'] = fab.valor; s[prefixo + '_fabricante_outro'] = fab.outro;
    s[prefixo + '_modelo'] = v.modelo || '';
    const partes = String(v.ano_fabricacao_modelo || '').split('/');
    s[prefixo + '_ano_fabricacao'] = partes[0] || ''; s[prefixo + '_ano_modelo'] = partes[1] || partes[0] || '';
    const cor = paraSelecaoOutro(v.cor, CORES_VEICULO);
    s[prefixo + '_cor'] = cor.valor; s[prefixo + '_cor_outro'] = cor.outro;
    s[prefixo + '_placa'] = v.placa || ''; s[prefixo + '_chassi'] = v.chassi || ''; s[prefixo + '_renavam'] = v.renavam || '';
    if (prefixo === 'ev') s.ev_valor = v.valor != null ? String(v.valor) : '';
}
function carregarParaEdicao(row) {
    const dados = row.dados || {};
    const a = dados.pessoa_a || {}, b = dados.pessoa_b || {}, e = dados.especifico || {};
    s.tipo = row.tipo_contrato === 'CONTRATO_CV_VEICULO' ? 'veiculo_cv' : row.tipo_contrato === 'CONTRATO_CV_IMOVEL' ? 'imovel_cv' : 'imovel_locacao';
    carregarPessoa('a', a);
    carregarPessoa('b', b);
    if (s.tipo === 'veiculo_cv') {
        carregarVeiculo('v', e);
    } else {
        const ti = paraSelecaoOutro(e.tipo_imovel, TIPOS_IMOVEL);
        s.im_tipo_imovel = ti.valor; s.im_tipo_imovel_outro = ti.outro;
        s.im_finalidade = e.finalidade || 'Residenciais';
        carregarEnderecoSolto('im', e.rua_imovel, e.numero_imovel, e.complemento_imovel, e.endereco_imovel);
        carregarCidadeBairro('im', e.cidade_imovel, e.bairro_imovel);
        s.im_estado = e.estado_imovel || '';
        s.im_terreno_frente = e.frente_m != null ? String(e.frente_m) : '';
        s.im_terreno_fundo = e.fundos_m != null ? String(e.fundos_m) : '';
        s.im_matricula = e.matricula || ''; s.im_cartorio = e.cartorio || '';
    }
    if (s.tipo === 'veiculo_cv' || s.tipo === 'imovel_cv') {
        s.forma_pagamento = e.forma_pagamento || '';
        s.valor_total = e.valor_total != null ? String(e.valor_total) : '';
        s.entrada_veiculo = e.entrada_veiculo || (e.veiculo_entrada ? 'Sim' : 'Não');
        if (s.entrada_veiculo === 'Sim') carregarVeiculo('ev', e.veiculo_entrada);
        s.teve_dinheiro_entrada = e.teve_dinheiro_entrada || (Number(e.valor_entrada) > 0 ? 'Sim' : 'Não');
        s.valor_entrada = e.valor_entrada ? String(e.valor_entrada) : '';
        s.num_parcelas = e.num_parcelas != null ? String(e.num_parcelas) : '';
        s.data_primeira_parcela = e.data_primeira_parcela || '';
    } else if (s.tipo === 'imovel_locacao') {
        s.valor_aluguel = e.valor_aluguel != null ? String(e.valor_aluguel) : '';
        s.dia_vencimento = e.dia_vencimento != null ? String(e.dia_vencimento) : '';
        s.prazo_meses = e.prazo_meses != null ? String(e.prazo_meses) : '';
        s.data_inicio = e.data_inicio || '';
        s.pagamento_agua = e.pagamento_agua || 'LOCATÁRIA'; s.pagamento_energia = e.pagamento_energia || 'LOCATÁRIA';
        s.permite_animais = e.permite_animais || 'Não';
        s.max_moradores = e.max_moradores != null ? String(e.max_moradores) : '';
        s.garantia = e.garantia || ''; s.valor_caucao = e.valor_caucao != null ? String(e.valor_caucao) : '';
        s.fiador_nome = e.fiador_nome || ''; s.fiador_cpf = e.fiador_cpf || '';
    }
    s.tem_testemunhas = e.tem_testemunhas || ((e.testemunha_1_nome || e.testemunha_2_nome) ? 'Sim' : 'Não');
    s.test1_nome = e.testemunha_1_nome || ''; s.test1_cpf = e.testemunha_1_cpf || '';
    s.test2_nome = e.testemunha_2_nome || ''; s.test2_cpf = e.testemunha_2_cpf || '';
}

async function iniciar() {
    const params = new URLSearchParams(location.search);
    const id = params.get('editId');
    if (!id) { buildSteps(); render(); return; }
    editMode = true; editId = id;
    document.getElementById('cardArea').innerHTML = '<p class="step-sub">Carregando contrato…</p>';
    const { data, error } = await supabase.from('declaracoes_pendentes').select('*').eq('id', id).single();
    const tiposSuportados = ['CONTRATO_CV_VEICULO', 'CONTRATO_CV_IMOVEL', 'CONTRATO_LOCACAO_IMOVEL'];
    if (error || !data || !tiposSuportados.includes(data.tipo_contrato)) {
        document.getElementById('cardArea').innerHTML = `
            <h2>Não foi possível abrir este contrato</h2>
            <p class="step-sub">O registro não foi encontrado ou não é de um tipo editável por aqui.</p>`;
        return;
    }
    carregarParaEdicao(data);
    const headerP = document.querySelector('.header p');
    if (headerP) headerP.textContent = 'Corrija os dados abaixo e salve as alterações.';
    buildSteps();
    stepIndex = 1; // pula a etapa de escolha do tipo, já sabido pelo registro
    render();
}

iniciar();
</script>
