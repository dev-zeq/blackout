<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Declaração de Trabalho — Blackout</title>
<style>
    :root {
        --bg: #05170c;
        --surface: #0c1f14;
        --surface-2: #0f2818;
        --border: rgba(255,255,255,0.08);
        --text: #eafff1;
        --text-dim: #8fa89a;
        --text-faint: #5c7568;
        --accent: #22c55e;
        --accent-bright: #4ade80;
        --accent-dim: rgba(34,197,94,0.12);
        --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        background: radial-gradient(circle at 50% 0%, #0a2415 0%, var(--bg) 55%); color: var(--text);
        padding: 24px 16px 60px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 22px; }
    .header .logo { width: 52px; height: 52px; margin: 0 auto 10px; }
    .header h1 { font-size: 19px; margin: 0 0 4px; }
    .header p { font-size: 12.5px; color: var(--text-dim); margin: 0; }
    .progress-track { height: 5px; background: var(--surface); border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); border-radius: 10px; transition: width .25s ease; }
    .step-label { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 18px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 22px 18px; }
    .card h2 { font-size: 15px; margin: 0 0 16px; color: var(--text); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
    .field .hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
    input[type=text], input[type=tel], input[type=email], input[type=date], input[type=time], input[type=number], select, textarea {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--text); font-size: 14.5px; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .radio-group, .check-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .radio-pill { flex: 1 1 auto; min-width: 90px; }
    .radio-pill input { position: absolute; opacity: 0; pointer-events: none; }
    .radio-pill .pill-label {
        display: block; text-align: center; padding: 11px 10px; border-radius: 12px; border: 1px solid var(--border);
        background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; transition: all .12s;
    }
    .radio-pill input:checked + .pill-label { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-bright); }
    .nav-row { display: flex; gap: 10px; margin-top: 22px; }
    .btn { flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-next { background: linear-gradient(135deg, var(--accent-bright), var(--accent)); color: #05170c; box-shadow: 0 4px 20px rgba(34,197,94,0.3); }
    .btn-back { background: var(--surface-2); color: var(--text-dim); flex: 0 0 90px; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .error-msg { color: var(--danger); font-size: 12px; margin-top: 10px; display: none; }
    .review-item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
    .review-item .rk { color: var(--text-dim); }
    .review-item .rv { color: var(--text); text-align: right; font-weight: 600; }
    .success-box { text-align: center; padding: 40px 10px; }
    .success-box .check { width: 64px; height: 64px; margin: 0 auto 18px; }
    .success-box h2 { font-size: 18px; margin-bottom: 8px; }
    .success-box p { color: var(--text-dim); font-size: 13.5px; }
    @media (max-width: 380px) { .card { padding: 18px 14px; } }
</style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="46" fill="#05170c" stroke="#22C55E" stroke-width="4"/>
            <g fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round">
                <path d="M 50 10 A 40 40 0 1 1 12 60"/>
            </g>
            <polygon points="50,8 42,22 58,22" fill="#22C55E"/>
            <text x="50" y="66" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="white">B</text>
        </svg>
        <h1>Declaração de Trabalho</h1>
        <p>Preencha seus dados e os da empresa pra gente montar sua declaração.</p>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="step-label" id="stepLabel"></div>

    <div class="card" id="cardArea"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://kihnavaovspdjnegcraj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_h5AITv-_Fjmnq-xC6UC8xg_8CSMLoZK';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const s = {
    nome: '', cpf: '', rg: '', genero: '', estado_civil: '', nacionalidade: 'Brasileiro(a)', profissao: '',
    rua: '', numero: '', complemento: '', bairro: '', cidade: '', cidade_outra: '', bairro_outro: '', estado: '',
    tipo_declaracao: '', empresa_nome: '', empresa_cnpj: '',
    dias_semana: '', horario_entrada: '', horario_saida: '',
    informar_renda: '', renda_mensal: '',
};

const ESTADOS_BR = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pill(name, value, checked, label) {
    const id = name + '_' + value.replace(/\W/g, '');
    return `<label class="radio-pill"><input type="radio" name="${name}" id="${id}" value="${esc(value)}" ${checked ? 'checked' : ''}><span class="pill-label" for="${id}">${esc(label || value)}</span></label>`;
}
function estadoOptions(selected) {
    return ESTADOS_BR.map(u => `<option value="${u}" ${selected === u ? 'selected' : ''}>${u}</option>`).join('');
}

// Cidade + bairro selecionáveis (região onde a Blackout atua) — evita erro de
// digitação tipo "cento" em vez de "Centro". "Outra"/"Outro" sempre libera
// campo livre, pra não travar quem é de fora da região.
const CIDADES_BAIRROS = {
    'Camboriú': ['Areias', 'Cedro', 'Centro', 'Conde Vila Verde', 'Lídia Duarte', 'Monte Alegre', 'Rio Pequeno', 'Santa Regina', 'São Francisco de Assis', 'Tabuleiro', 'Várzea do Ranchinho'],
    'Balneário Camboriú': ['Ariribá', 'Barra', 'Barra Norte', 'Barra Sul', 'Centro', 'Estados', 'Estaleiro', 'Estaleirinho', 'Interpraias', 'Jardim Iate Clube', 'Laranjeiras', 'Municípios', 'Nações', 'Nova Esperança', 'Pioneiros', 'Praia dos Amores', 'São Judas', 'Vila Real'],
    'Itapema': ['Alto do São Bento', 'Andorinha', 'Canto da Praia', 'Casa Branca', 'Castelo Branco', 'Centro', 'Ilhota', 'Meia Praia', 'Morretes', 'Sertãozinho', 'Tabuleiro dos Oliveiras', 'Várzea'],
    'Itajaí': ['Centro', 'Cabeçudas', 'Praia Brava', 'Fazenda', 'Cordeiros', 'São Vicente', 'Barra do Rio', 'Dom Bosco', 'São João', 'Espinheiros', 'Ressacada', 'Salseiros', 'Vila Operária', 'Murta', 'Rio Bonito'],
};
const CIDADES_OPTS = [...Object.keys(CIDADES_BAIRROS), 'Outra'];
// Essas 4 cidades são sempre de SC — o formulário assume o estado sozinho e
// nem pergunta, pra não travar quem não sabe a sigla. Outras cidades (inclusive
// "Outra") continuam pedindo o Estado normalmente.
const CIDADES_SC = ['Camboriú', 'Balneário Camboriú', 'Itapema', 'Itajaí'];
function cidadeOptions(selected) {
    return '<option value="">Selecione</option>' + CIDADES_OPTS.map(c => `<option value="${c}" ${selected === c ? 'selected' : ''}>${c}</option>`).join('');
}
function bairroOptions(cidade, selected) {
    const lista = CIDADES_BAIRROS[cidade] || [];
    return '<option value="">Selecione</option>' + lista.map(b => `<option value="${b}" ${selected === b ? 'selected' : ''}>${b}</option>`).join('') + `<option value="__outro__" ${selected === '__outro__' ? 'selected' : ''}>Outro</option>`;
}
function renderCondCidade() {
    const el = document.getElementById('condCidade');
    if (!el) return;
    let html = '';
    if (s.cidade === 'Outra') {
        html += `<div class="field"><label>Qual cidade? *</label><input type="text" id="f_cidade_outra" value="${esc(s.cidade_outra)}"></div>`;
        html += `<div class="field"><label>Bairro *</label><input type="text" id="f_bairro_livre" value="${esc(s.bairro_outro)}"></div>`;
    } else if (s.cidade) {
        html += `<div class="field"><label>Bairro *</label><select id="f_bairro">${bairroOptions(s.cidade, s.bairro)}</select></div>`;
        html += `<div id="condBairroOutro"></div>`;
    }
    el.innerHTML = html;
    const selCidadeOutra = document.getElementById('f_cidade_outra');
    if (selCidadeOutra) selCidadeOutra.addEventListener('input', () => { s.cidade_outra = selCidadeOutra.value; });
    const inpBairroLivre = document.getElementById('f_bairro_livre');
    if (inpBairroLivre) inpBairroLivre.addEventListener('input', () => { s.bairro_outro = inpBairroLivre.value; });
    const selBairro = document.getElementById('f_bairro');
    if (selBairro) selBairro.addEventListener('change', () => { s.bairro = selBairro.value; renderCondBairroOutro(); });
    renderCondBairroOutro();
}
function renderCondBairroOutro() {
    const el = document.getElementById('condBairroOutro');
    if (!el) return;
    el.innerHTML = s.bairro === '__outro__' ? `<div class="field"><label>Qual bairro? *</label><input type="text" id="f_bairro_livre_outro" value="${esc(s.bairro_outro)}"></div>` : '';
    const inp = document.getElementById('f_bairro_livre_outro');
    if (inp) inp.addEventListener('input', () => { s.bairro_outro = inp.value; });
}
function cidadeFinal() { return s.cidade === 'Outra' ? s.cidade_outra : s.cidade; }
function bairroFinal() { return (s.cidade === 'Outra' || s.bairro === '__outro__') ? s.bairro_outro : s.bairro; }
// Rua/Número/Complemento entram separados e são compostos num endereço só na
// hora de enviar/exibir.
function enderecoFinal() {
    const rua = (s.rua || '').trim();
    const numero = (s.numero || '').trim();
    const complemento = (s.complemento || '').trim();
    if (!rua && !numero) return '';
    let out = rua;
    if (numero) out += (out ? ', nº ' : 'nº ') + numero;
    if (complemento) out += ', ' + complemento;
    return out;
}
// Camboriú, Balneário Camboriú, Itapema e Itajaí são sempre SC — nesses casos
// nem mostra o campo de Estado, já assume a sigla sozinho.
function estadoForcadoSC() { return CIDADES_SC.includes(s.cidade); }
function estadoFinal() { return estadoForcadoSC() ? 'SC' : s.estado; }
function estadoCampoHtml() {
    if (estadoForcadoSC()) { s.estado = 'SC'; return ''; }
    return `<div class="field"><label>Estado *</label><select id="f_estado"><option value="">Selecione</option>${estadoOptions(s.estado)}</select></div>`;
}
function renderCondEstado() {
    const el = document.getElementById('cond_estado');
    if (!el) return;
    el.innerHTML = estadoCampoHtml();
}
// Caminho inverso de cidadeFinal()/bairroFinal() — usado só ao recarregar um
// registro salvo pra edição (ver carregarParaEdicao).
function carregarCidadeBairro(cidadeSalva, bairroSalvo) {
    if (cidadeSalva && CIDADES_OPTS.includes(cidadeSalva) && cidadeSalva !== 'Outra') {
        s.cidade = cidadeSalva;
        const lista = CIDADES_BAIRROS[cidadeSalva] || [];
        if (bairroSalvo && lista.includes(bairroSalvo)) { s.bairro = bairroSalvo; }
        else { s.bairro = '__outro__'; s.bairro_outro = bairroSalvo || ''; }
    } else {
        s.cidade = cidadeSalva ? 'Outra' : '';
        s.cidade_outra = cidadeSalva || '';
        s.bairro_outro = bairroSalvo || '';
    }
}

let stepIndex = 0;
let steps = [stepDados, stepEndereco, stepEmpresa, stepRevisao];

function render() {
    const total = steps.length;
    document.getElementById('progressFill').style.width = Math.round((stepIndex / (total - 1)) * 100) + '%';
    document.getElementById('stepLabel').textContent = `Etapa ${stepIndex + 1} de ${total}`;
    const card = document.getElementById('cardArea');
    card.innerHTML = steps[stepIndex]();
    bindStepEvents();
}
function goNext() {
    saveCurrentStep();
    const err = validateCurrentStep();
    if (err) { showError(err); return; }
    if (stepIndex < steps.length - 1) { stepIndex++; render(); window.scrollTo(0, 0); }
}
function goBack() { if (stepIndex > 0) { stepIndex--; render(); window.scrollTo(0, 0); } }
function showError(msg) {
    const el = document.getElementById('errorMsg');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
}
function val(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function checkedVal(name) { const e = document.querySelector(`input[name="${name}"]:checked`); return e ? e.value : ''; }

// ---------- Etapa 1: Dados pessoais (funcionário) ----------
function stepDados() {
    return `
    <h2>Seus dados</h2>
    <div class="field"><label>Nome completo *</label><input type="text" id="f_nome" value="${esc(s.nome)}"></div>
    <div class="field"><label>CPF *</label><input type="text" id="f_cpf" value="${esc(s.cpf)}" placeholder="000.000.000-00"></div>
    <div class="field"><label>RG</label><input type="text" id="f_rg" value="${esc(s.rg)}"></div>
    <div class="field"><label>Gênero *</label>
        <div class="radio-group">${pill('f_genero', 'Masculino', s.genero === 'Masculino')}${pill('f_genero', 'Feminino', s.genero === 'Feminino')}</div>
    </div>
    <div class="field"><label>Estado civil *</label>
        <select id="f_estado_civil"><option value="">Selecione</option>${['Solteiro(a)','Casado(a)','Divorciado(a)','Viúvo(a)','União Estável'].map(o => `<option value="${o}" ${s.estado_civil === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Nacionalidade *</label><input type="text" id="f_nacionalidade" value="${esc(s.nacionalidade)}"></div>
    <div id="errorMsg" class="error-msg"></div>
    <div class="nav-row"><button class="btn btn-next" onclick="window.__goNext()">Avançar</button></div>`;
}

// ---------- Etapa 2: Endereço ----------
function stepEndereco() {
    return `
    <h2>Endereço</h2>
    <div class="field"><label>Rua *</label><input type="text" id="f_rua" value="${esc(s.rua)}"></div>
    <div class="field"><label>Número *</label><input type="text" id="f_numero" value="${esc(s.numero)}"></div>
    <div class="field"><label>Complemento (não obrigatório)</label><input type="text" id="f_complemento" value="${esc(s.complemento)}"></div>
    <div class="field"><label>Cidade *</label><select id="f_cidade">${cidadeOptions(s.cidade)}</select></div>
    <div id="condCidade"></div>
    <div id="cond_estado">${estadoCampoHtml()}</div>
    <div id="errorMsg" class="error-msg"></div>
    <div class="nav-row"><button class="btn btn-back" onclick="window.__goBack()">Voltar</button><button class="btn btn-next" onclick="window.__goNext()">Avançar</button></div>`;
}

// ---------- Etapa 3: Empresa / trabalho ----------
function stepEmpresa() {
    return `
    <h2>Sobre seu trabalho</h2>
    <div class="field"><label>Sua profissão/cargo *</label><input type="text" id="f_profissao" value="${esc(s.profissao)}"></div>
    <div class="field"><label>Nome da empresa *</label><input type="text" id="f_empresa_nome" value="${esc(s.empresa_nome)}"></div>
    <div class="field"><label>CNPJ da empresa</label><input type="text" id="f_empresa_cnpj" value="${esc(s.empresa_cnpj)}" placeholder="00.000.000/0000-00"></div>
    <div class="field"><label>Quais dias você trabalha? *</label><input type="text" id="f_dias_semana" value="${esc(s.dias_semana)}" placeholder="ex: de segunda à sábado"></div>
    <div class="field"><label>Horário de entrada *</label><input type="time" id="f_horario_entrada" value="${esc(s.horario_entrada)}"></div>
    <div class="field"><label>Horário de saída *</label><input type="time" id="f_horario_saida" value="${esc(s.horario_saida)}"></div>
    <div class="field"><label>Quer informar sua renda mensal na declaração?</label>
        <div class="radio-group">${pill('f_informar_renda', 'SIM', s.informar_renda === 'SIM')}${pill('f_informar_renda', 'NAO', s.informar_renda === 'NAO', 'Não')}</div>
    </div>
    <div id="condRenda"></div>
    <div id="errorMsg" class="error-msg"></div>
    <div class="nav-row"><button class="btn btn-back" onclick="window.__goBack()">Voltar</button><button class="btn btn-next" onclick="window.__goNext()">Avançar</button></div>`;
}
function renderCondRenda() {
    const el = document.getElementById('condRenda');
    if (!el) return;
    el.innerHTML = s.informar_renda === 'SIM' ? `<div class="field"><label>Renda mensal (R$)</label><input type="number" step="0.01" id="f_renda_mensal" value="${esc(s.renda_mensal)}"></div>` : '';
}

// ---------- Etapa 4: Revisão ----------
function stepRevisao() {
    const rows = [
        ['Nome', s.nome], ['CPF', s.cpf],
        ['Endereço', `${enderecoFinal()}, ${bairroFinal()}, ${cidadeFinal()}/${estadoFinal()}`],
        ['Empresa', s.empresa_nome], ['CNPJ', s.empresa_cnpj || '—'],
        ['Dias', s.dias_semana], ['Horário', `${s.horario_entrada} às ${s.horario_saida}`],
        ['Renda mensal', s.informar_renda === 'SIM' ? ('R$ ' + s.renda_mensal) : 'não informada'],
    ];
    return `
    <h2>${editMode ? 'Confira e salve' : 'Confira e envie'}</h2>
    ${rows.map(([k, v]) => `<div class="review-item"><span class="rk">${esc(k)}</span><span class="rv">${esc(v)}</span></div>`).join('')}
    <div id="errorMsg" class="error-msg"></div>
    <div class="nav-row"><button class="btn btn-back" onclick="window.__goBack()">Voltar</button><button class="btn btn-next" id="btnSubmit">${editMode ? 'Salvar alterações' : 'Enviar declaração'}</button></div>
    ${editMode ? `<p style="text-align:center; margin-top:14px;"><a href="#" onclick="window.__cancelarEdicao(); return false;" style="color:var(--text-faint); font-size:12.5px;">Cancelar edição</a></p>` : ''}`;
}

// ---------- Validação e coleta ----------
function validateCurrentStep() {
    switch (stepIndex) {
        case 0:
            if (!s.nome || !s.cpf || !s.genero || !s.estado_civil || !s.nacionalidade) return 'Preencha todos os campos obrigatórios (*).';
            return null;
        case 1:
            if (!s.rua || !s.numero || !cidadeFinal() || !bairroFinal() || !estadoFinal()) return 'Preencha todos os campos obrigatórios (*).';
            return null;
        case 2:
            if (!s.profissao || !s.empresa_nome || !s.dias_semana || !s.horario_entrada || !s.horario_saida) return 'Preencha todos os campos obrigatórios (*).';
            return null;
        default: return null;
    }
}
function saveCurrentStep() {
    switch (stepIndex) {
        case 0:
            s.nome = val('f_nome'); s.cpf = val('f_cpf'); s.rg = val('f_rg');
            s.genero = checkedVal('f_genero'); s.estado_civil = val('f_estado_civil'); s.nacionalidade = val('f_nacionalidade');
            break;
        case 1:
            s.rua = val('f_rua'); s.numero = val('f_numero'); s.complemento = val('f_complemento');
            s.cidade = val('f_cidade');
            if (!estadoForcadoSC()) s.estado = val('f_estado');
            break;
        case 2:
            s.profissao = val('f_profissao'); s.empresa_nome = val('f_empresa_nome'); s.empresa_cnpj = val('f_empresa_cnpj');
            s.dias_semana = val('f_dias_semana'); s.horario_entrada = val('f_horario_entrada'); s.horario_saida = val('f_horario_saida');
            s.informar_renda = checkedVal('f_informar_renda'); s.renda_mensal = val('f_renda_mensal');
            break;
    }
}
function bindStepEvents() {
    const selCidade = document.getElementById('f_cidade');
    if (selCidade) selCidade.addEventListener('change', () => { s.cidade = selCidade.value; s.bairro = ''; s.estado = estadoForcadoSC() ? 'SC' : ''; renderCondCidade(); renderCondEstado(); });
    renderCondCidade();
    renderCondEstado();
    document.querySelectorAll('input[name="f_informar_renda"]').forEach(r => r.addEventListener('change', () => { s.informar_renda = checkedVal('f_informar_renda'); renderCondRenda(); }));
    renderCondRenda();
    const btnSubmit = document.getElementById('btnSubmit');
    if (btnSubmit) btnSubmit.addEventListener('click', submitForm);
}

// ---------- Envio ----------
async function submitForm() {
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true; btn.textContent = 'Enviando...';

    const registro = {
        tipo_contrato: 'DECLARACAO_TRABALHO',
        dados: {
            pessoa_a: {
                nome: s.nome, cpf: s.cpf, rg: s.rg || null, genero: s.genero,
                estado_civil: s.estado_civil, nacionalidade: s.nacionalidade, profissao: s.profissao,
                endereco: enderecoFinal(), rua: s.rua || null, numero: s.numero || null, complemento: s.complemento || null,
                bairro: bairroFinal(), cidade: cidadeFinal(), estado: estadoFinal(),
            },
            especifico: {
                tipo_declaracao: 'Funcionário trabalha em uma Empresa com CNPJ',
                empresa_nome: s.empresa_nome, empresa_cnpj: s.empresa_cnpj || null,
                dias_semana: s.dias_semana,
                horario_entrada: s.horario_entrada, horario_saida: s.horario_saida,
                informar_renda: s.informar_renda || 'NAO',
                renda_mensal: s.informar_renda === 'SIM' ? s.renda_mensal : null,
            },
        },
    };

    if (editMode) {
        // O formulário público não tem (e não deve ter) a senha de escrita da
        // equipe — só o painel tem, depois de desbloqueado. Por isso quem grava
        // a edição é o painel: a gente só manda os dados prontos e espera a
        // resposta (ver window.addEventListener('message') abaixo).
        avisarPai({ type: 'form-salvar-pedido', table: 'declaracoes_pendentes', id: editId, registro });
        return;
    }

    const { error } = await supabase.from('declaracoes_pendentes').insert(registro);
    if (error) {
        showError('Não deu pra enviar agora. Tenta de novo em alguns segundos — se persistir, chama a gente pelo WhatsApp.');
        btn.disabled = false; btn.textContent = 'Enviar declaração';
        return;
    }
    document.getElementById('cardArea').innerHTML = `
        <div class="success-box">
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>
            <h2>Declaração enviada!</h2>
            <p>Recebemos suas informações. A equipe da Blackout vai preparar sua declaração.</p>
        </div>`;
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('stepLabel').textContent = 'Concluído';
}
// Resposta do painel ao pedido de salvar (form-salvar-pedido) — só existe
// quando o formulário está embutido no iframe de edição do painel.
window.addEventListener('message', (ev) => {
    if (ev.origin !== window.location.origin) return;
    if (!ev.data || ev.data.type !== 'form-salvar-resultado') return;
    const btn = document.getElementById('btnSubmit');
    if (ev.data.ok) {
        document.getElementById('cardArea').innerHTML = `
            <div class="success-box">
                <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>
                <h2>Alterações salvas!</h2>
                <p>A declaração foi atualizada.</p>
            </div>`;
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('stepLabel').textContent = 'Concluído';
    } else {
        showError(ev.data.error || 'Não deu pra salvar agora. Tenta de novo em alguns segundos — se persistir, chama a gente pelo WhatsApp.');
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar alterações'; }
    }
});

// ---------- Modo de edição (reabre o formulário já preenchido a partir de um
// registro existente em declaracoes_pendentes, pra corrigir sem duplicar) ----------
let editMode = false;
let editId = null;

function avisarPai(msg) {
    if (window.parent && window.parent !== window) window.parent.postMessage(msg, window.location.origin);
}
function cancelarEdicao() {
    avisarPai({ type: 'form-editar-cancelado' });
    if (window.parent === window) history.back();
}
window.__cancelarEdicao = cancelarEdicao;

// Registro salvo antes dessa versão do formulário — só tinha o endereço já
// junto. Não dá pra separar com segurança, então joga tudo em "Rua" e deixa
// Número/Complemento em branco pro usuário ajustar.
function carregarEnderecoSolto(rua, numero, complemento, enderecoComposto) {
    if (rua || numero || complemento) {
        s.rua = rua || ''; s.numero = numero || ''; s.complemento = complemento || '';
    } else if (enderecoComposto) {
        s.rua = enderecoComposto; s.numero = ''; s.complemento = '';
    }
}
function carregarParaEdicao(row) {
    const dados = row.dados || {};
    const a = dados.pessoa_a || {};
    const e = dados.especifico || {};
    s.nome = a.nome || ''; s.cpf = a.cpf || ''; s.rg = a.rg || ''; s.genero = a.genero || '';
    s.estado_civil = a.estado_civil || ''; s.nacionalidade = a.nacionalidade || 'Brasileiro(a)';
    s.profissao = a.profissao || '';
    carregarEnderecoSolto(a.rua, a.numero, a.complemento, a.endereco);
    carregarCidadeBairro(a.cidade, a.bairro);
    s.estado = a.estado || '';
    s.empresa_nome = e.empresa_nome || ''; s.empresa_cnpj = e.empresa_cnpj || '';
    s.dias_semana = e.dias_semana || '';
    s.horario_entrada = e.horario_entrada || ''; s.horario_saida = e.horario_saida || '';
    s.informar_renda = e.informar_renda || 'NAO';
    s.renda_mensal = e.renda_mensal != null ? String(e.renda_mensal) : '';
}

async function iniciar() {
    const params = new URLSearchParams(location.search);
    const id = params.get('editId');
    if (!id) { render(); return; }
    editMode = true; editId = id;
    document.getElementById('cardArea').innerHTML = '<p style="color:var(--text-dim); font-size:13px;">Carregando declaração…</p>';
    const { data, error } = await supabase.from('declaracoes_pendentes').select('*').eq('id', id).single();
    if (error || !data || data.tipo_contrato !== 'DECLARACAO_TRABALHO') {
        document.getElementById('cardArea').innerHTML = `
            <h2>Não foi possível abrir esta declaração</h2>
            <p style="color:var(--text-dim); font-size:13px;">O registro não foi encontrado ou não é desse tipo.</p>`;
        return;
    }
    carregarParaEdicao(data);
    const headerP = document.querySelector('.header p');
    if (headerP) headerP.textContent = 'Corrija os dados abaixo e salve as alterações.';
    render();
}

window.__goNext = goNext;
window.__goBack = goBack;
iniciar();
</script>
</body>
</html>
