<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Currículo — Blackout</title>
<style>
    :root {
        --bg: #05170c;
        --surface: #0c1f14;
        --surface-2: #0f2818;
        --border: rgba(255,255,255,0.08);
        --text: #eafff1;
        --text-dim: #8fa89a;
        --text-faint: #5c7568;
        --accent: #22c55e;
        --accent-bright: #4ade80;
        --accent-dim: rgba(34,197,94,0.12);
        --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        background: radial-gradient(circle at 50% 0%, #0a2415 0%, var(--bg) 55%); color: var(--text);
        padding: 24px 16px 60px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 22px; }
    .header .logo { width: 52px; height: 52px; margin: 0 auto 10px; }
    .header h1 { font-size: 19px; margin: 0 0 4px; }
    .header p { font-size: 12.5px; color: var(--text-dim); margin: 0; }
    .progress-track { height: 5px; background: var(--surface); border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); border-radius: 10px; transition: width .25s ease; }
    .step-label { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 18px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 22px 18px; }
    .card h2 { font-size: 15px; margin: 0 0 16px; color: var(--text); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
    .field .hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
    input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number], select, textarea {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--text); font-size: 14.5px; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .radio-group, .check-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .date-row { display: flex; gap: 8px; }
    .date-row select { flex: 1; min-width: 0; }
    .radio-pill { flex: 1 1 auto; min-width: 90px; }
    .radio-pill input { position: absolute; opacity: 0; pointer-events: none; }
    .radio-pill .pill-label {
        display: block; text-align: center; padding: 11px 10px; border-radius: 12px; border: 1px solid var(--border);
        background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; transition: all .12s;
    }
    .radio-pill input:checked + .pill-label { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-bright); }
    .repeat-block { border: 1px dashed var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; position: relative; }
    .repeat-block .repeat-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-bright); margin-bottom: 10px; }
    .btn-remove { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--danger); font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-add { width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed rgba(34,197,94,0.4); background: none; color: var(--accent-bright); font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
    .nav-row { display: flex; gap: 10px; margin-top: 22px; }
    .btn { flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-next { background: linear-gradient(135deg, var(--accent-bright), var(--accent)); color: #05170c; box-shadow: 0 4px 20px rgba(34,197,94,0.3); }
    .btn-back { background: var(--surface-2); color: var(--text-dim); flex: 0 0 90px; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .error-msg { color: var(--danger); font-size: 12px; margin-top: 10px; display: none; }
    /* Aviso não-bloqueante de período de estudo × disponibilidade (2026-08-21)
       — âmbar, pra diferenciar de erro (vermelho) e de confirmação positiva
       (verde), sem introduzir cor nova fora da paleta de status já usada. */
    .aviso-disponibilidade { background: rgba(245,165,36,0.08); border: 1px solid rgba(245,165,36,0.35); border-radius: 14px; padding: 14px; margin-top: 4px; }
    .aviso-disponibilidade p { font-size: 13px; line-height: 1.5; color: var(--text); margin: 0; }
    .review-item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
    .review-item .rk { color: var(--text-dim); }
    .review-item .rv { color: var(--text); text-align: right; font-weight: 600; }
    .success-box { text-align: center; padding: 40px 10px; }
    .success-box .check { width: 64px; height: 64px; margin: 0 auto 18px; }
    .success-box h2 { font-size: 18px; margin-bottom: 8px; }
    .success-box p { color: var(--text-dim); font-size: 13.5px; }
    @media (max-width: 380px) { .card { padding: 18px 14px; } }
</style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="46" fill="#05170c" stroke="#22C55E" stroke-width="4"/>
            <g fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round">
                <path d="M 50 10 A 40 40 0 1 1 12 60"/>
            </g>
            <polygon points="50,8 42,22 58,22" fill="#22C55E"/>
            <text x="50" y="66" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="white">B</text>
        </svg>
        <h1>Formulário de Currículo</h1>
        <p>Preencha com calma — leva uns minutos, e é só isso que a gente precisa pra montar seu currículo.</p>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="step-label" id="stepLabel"></div>

    <div class="card" id="cardArea"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://kihnavaovspdjnegcraj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_h5AITv-_Fjmnq-xC6UC8xg_8CSMLoZK';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Estado bruto do formulário. Chaves curtas internas — convertidas pro texto
// original das perguntas (o mesmo usado pelo Apps Script/planilha) só na hora
// de montar o payload final, pra manter compatibilidade com os registros
// que já existem no Supabase.
const s = {
    nome: '', sobrenome: '', sexo: '', nascimento: '', nacionalidade: '', nacionalidade_outra: '',
    naturalidade: '', estado_nascimento: '', estado_civil: '', tem_filhos: '', qtd_filhos: '', situacao_filhos: '',
    ddd: '', telefone_numero: '', whatsapp_mesmo: '', ddd_whatsapp: '', whatsapp_numero: '',
    tem_email: '', email: '',
    rua: '', numero: '', complemento: '', bairro: '', cidade: '', cidade_outra: '', bairro_outro: '', estado_residencia: '',
    escolaridade: '', situacao_escolaridade: '', periodo_estudo: '',
    fez_curso: '', cursos: [],
    informatica: '', outros_idiomas: '', idiomas: [],
    tem_experiencia: '', empresas: [],
    referencias: [],
    fumante: '', disponibilidade: [], destacar_cargo: '', qual_cargo: '', tipo_cargo_busca: '',
    tem_cnh: '', categoria_cnh: '', tem_ear: '',
};
let fotoFile = null; // File object, fica fora de `s` (não é serializável do mesmo jeito)
let fotoPreviewUrl = null;
let fotoUrlOriginal = null; // foto já salva (modo de edição) — preservada se o usuário não mexer nela
let fotoRemovida = false; // usuário clicou em "remover foto" numa foto que já existia

const ESTADOS_BR = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pill(name, value, checked, label) {
    const id = name + '_' + value.replace(/\W/g, '');
    return `<label class="radio-pill"><input type="radio" name="${name}" id="${id}" value="${esc(value)}" ${checked ? 'checked' : ''}><span class="pill-label" for="${id}">${esc(label || value)}</span></label>`;
}
function estadoOptions(selected) {
    return ESTADOS_BR.map(u => `<option value="${u}" ${selected === u ? 'selected' : ''}>${u}</option>`).join('');
}

// Cidade + bairro selecionáveis (região onde a Blackout atua) — evita erro de
// digitação tipo "cento" em vez de "Centro". "Outra"/"Outro" sempre libera
// campo livre, pra não travar quem é de fora da região.
const CIDADES_BAIRROS = {
    'Camboriú': ['Areias', 'Cedro', 'Centro', 'Conde Vila Verde', 'Lídia Duarte', 'Monte Alegre', 'Rio Pequeno', 'Santa Regina', 'São Francisco de Assis', 'Tabuleiro', 'Várzea do Ranchinho'],
    'Balneário Camboriú': ['Ariribá', 'Barra', 'Barra Norte', 'Barra Sul', 'Centro', 'Estados', 'Estaleiro', 'Estaleirinho', 'Interpraias', 'Jardim Iate Clube', 'Laranjeiras', 'Municípios', 'Nações', 'Nova Esperança', 'Pioneiros', 'Praia dos Amores', 'São Judas', 'Vila Real'],
    'Itapema': ['Alto do São Bento', 'Andorinha', 'Canto da Praia', 'Casa Branca', 'Castelo Branco', 'Centro', 'Ilhota', 'Meia Praia', 'Morretes', 'Sertãozinho', 'Tabuleiro dos Oliveiras', 'Várzea'],
    'Itajaí': ['Centro', 'Cabeçudas', 'Praia Brava', 'Fazenda', 'Cordeiros', 'São Vicente', 'Barra do Rio', 'Dom Bosco', 'São João', 'Espinheiros', 'Ressacada', 'Salseiros', 'Vila Operária', 'Murta', 'Rio Bonito'],
};
const CIDADES_OPTS = [...Object.keys(CIDADES_BAIRROS), 'Outra'];
// Essas 4 cidades são sempre de SC — o formulário assume o estado sozinho e
// nem pergunta, pra não travar quem não sabe a sigla. Outras cidades (inclusive
// "Outra") continuam pedindo o Estado normalmente.
const CIDADES_SC = ['Camboriú', 'Balneário Camboriú', 'Itapema', 'Itajaí'];
function cidadeOptions(selected) {
    return '<option value="">Selecione</option>' + CIDADES_OPTS.map(c => `<option value="${c}" ${selected === c ? 'selected' : ''}>${c}</option>`).join('');
}
function bairroOptions(cidade, selected) {
    const lista = CIDADES_BAIRROS[cidade] || [];
    return '<option value="">Selecione</option>' + lista.map(b => `<option value="${b}" ${selected === b ? 'selected' : ''}>${b}</option>`).join('') + `<option value="__outro__" ${selected === '__outro__' ? 'selected' : ''}>Outro</option>`;
}
function renderCondCidade() {
    const el = document.getElementById('condCidade');
    if (!el) return;
    let html = '';
    if (s.cidade === 'Outra') {
        html += `<div class="field"><label>Qual cidade? *</label><input type="text" id="f_cidade_outra" value="${esc(s.cidade_outra)}"></div>`;
        html += `<div class="field"><label>Bairro *</label><input type="text" id="f_bairro_livre" value="${esc(s.bairro_outro)}"></div>`;
    } else if (s.cidade) {
        html += `<div class="field"><label>Bairro *</label><select id="f_bairro">${bairroOptions(s.cidade, s.bairro)}</select></div>`;
        html += `<div id="condBairroOutro"></div>`;
    }
    el.innerHTML = html;
    const selCidadeOutra = document.getElementById('f_cidade_outra');
    if (selCidadeOutra) selCidadeOutra.addEventListener('input', () => { s.cidade_outra = selCidadeOutra.value; });
    const inpBairroLivre = document.getElementById('f_bairro_livre');
    if (inpBairroLivre) inpBairroLivre.addEventListener('input', () => { s.bairro_outro = inpBairroLivre.value; });
    const selBairro = document.getElementById('f_bairro');
    if (selBairro) selBairro.addEventListener('change', () => { s.bairro = selBairro.value; renderCondBairroOutro(); });
    renderCondBairroOutro();
}
function renderCondBairroOutro() {
    const el = document.getElementById('condBairroOutro');
    if (!el) return;
    el.innerHTML = s.bairro === '__outro__' ? `<div class="field"><label>Qual bairro? *</label><input type="text" id="f_bairro_livre_outro" value="${esc(s.bairro_outro)}"></div>` : '';
    const inp = document.getElementById('f_bairro_livre_outro');
    if (inp) inp.addEventListener('input', () => { s.bairro_outro = inp.value; });
}
function cidadeFinal() { return s.cidade === 'Outra' ? s.cidade_outra : s.cidade; }
function bairroFinal() { return (s.cidade === 'Outra' || s.bairro === '__outro__') ? s.bairro_outro : s.bairro; }
// Rua/Número/Complemento entram separados e são compostos num endereço só na
// hora de enviar/exibir.
function enderecoFinal() {
    const rua = (s.rua || '').trim();
    const numero = (s.numero || '').trim();
    const complemento = (s.complemento || '').trim();
    if (!rua && !numero) return '';
    let out = rua;
    if (numero) out += (out ? ', nº ' : 'nº ') + numero;
    if (complemento) out += ', ' + complemento;
    return out;
}
// Camboriú, Balneário Camboriú, Itapema e Itajaí são sempre SC — nesses casos
// nem mostra o campo de Estado, já assume a sigla sozinho.
function estadoForcadoSC() { return CIDADES_SC.includes(s.cidade); }
function estadoResidenciaFinal() { return estadoForcadoSC() ? 'SC' : s.estado_residencia; }
function estadoResidenciaCampoHtml() {
    if (estadoForcadoSC()) { s.estado_residencia = 'SC'; return ''; }
    return `<div class="field"><label>Estado *</label><select id="f_estado_res"><option value="">Selecione</option>${estadoOptions(s.estado_residencia)}</select></div>`;
}
function renderCondEstadoResidencia() {
    const el = document.getElementById('cond_estado_res');
    if (!el) return;
    el.innerHTML = estadoResidenciaCampoHtml();
}
// Caminho inverso de cidadeFinal()/bairroFinal() — usado só ao recarregar um
// registro salvo pra edição (ver carregarParaEdicao).
function carregarCidadeBairro(cidadeSalva, bairroSalvo) {
    if (cidadeSalva && CIDADES_OPTS.includes(cidadeSalva) && cidadeSalva !== 'Outra') {
        s.cidade = cidadeSalva;
        const lista = CIDADES_BAIRROS[cidadeSalva] || [];
        if (bairroSalvo && lista.includes(bairroSalvo)) { s.bairro = bairroSalvo; }
        else { s.bairro = '__outro__'; s.bairro_outro = bairroSalvo || ''; }
    } else {
        s.cidade = cidadeSalva ? 'Outra' : '';
        s.cidade_outra = cidadeSalva || '';
        s.bairro_outro = bairroSalvo || '';
    }
}

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function dataNascimentoFields() {
    const [ay, am, ad] = (s.nascimento || '').split('-');
    const anoAtual = new Date().getFullYear();
    let anoOpts = '<option value="">Ano</option>';
    for (let y = anoAtual; y >= anoAtual - 90; y--) anoOpts += `<option value="${y}" ${String(y) === ay ? 'selected' : ''}>${y}</option>`;
    let mesOpts = '<option value="">Mês</option>' + MESES.map((m, i) => { const mm = String(i + 1).padStart(2, '0'); return `<option value="${mm}" ${mm === am ? 'selected' : ''}>${m}</option>`; }).join('');
    let diaOpts = '<option value="">Dia</option>';
    for (let d = 1; d <= 31; d++) { const dd = String(d).padStart(2, '0'); diaOpts += `<option value="${dd}" ${dd === ad ? 'selected' : ''}>${d}</option>`; }
    return `
    <div class="field"><label>Data de nascimento *</label>
        <div class="date-row">
            <select id="f_nasc_dia">${diaOpts}</select>
            <select id="f_nasc_mes">${mesOpts}</select>
            <select id="f_nasc_ano">${anoOpts}</select>
        </div>
    </div>`;
}

let stepIndex = 0;
let steps = [];

function buildSteps() {
    steps = [
        stepDadosPessoais, stepFamilia, stepContato, stepEmailEndereco,
        stepFormacao, stepCursos, stepInformaticaIdiomas, stepExperiencia,
        stepReferencias, stepPreferencias, stepCnh, stepFoto, stepRevisao,
    ];
}

function render() {
    const total = steps.length;
    document.getElementById('progressFill').style.width = Math.round((stepIndex / (total - 1)) * 100) + '%';
    document.getElementById('stepLabel').textContent = `Etapa ${stepIndex + 1} de ${total}`;
    const card = document.getElementById('cardArea');
    card.innerHTML = steps[stepIndex]();
    bindStepEvents();
}

function goNext(ignorarAvisoDisponibilidade) {
    saveCurrentStep();
    const err = validateCurrentStep();
    if (err) { showError(err); return; }
    // Confirmação não-bloqueante entre período de estudo × disponibilidade de
    // horário (2026-08-21) — só intercepta o avanço na etapa de Preferências,
    // e só quando não veio de "Manter informação" (que já pediu pra ignorar).
    if (!ignorarAvisoDisponibilidade && steps[stepIndex] === stepPreferencias) {
        const conflito = verificarConflitoDisponibilidade();
        if (conflito) { mostrarAvisoDisponibilidade(conflito); return; }
    }
    if (stepIndex < steps.length - 1) { stepIndex++; render(); window.scrollTo(0, 0); }
}
function goBack() {
    if (stepIndex > 0) { stepIndex--; render(); window.scrollTo(0, 0); }
}
function showError(msg) {
    const el = document.getElementById('errorMsg');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
}

// Nome completo é um campo só na UI (pedido do usuário, 2026-08-21), mas o
// banco continua com `nome`/`sobrenome` separados (mesmas colunas de sempre,
// mesma automação/edição) — esse helper só recompõe o valor pra mostrar no
// input; a separação de volta em s.nome/s.sobrenome acontece em saveCurrentStep.
function nomeCompletoAtual() { return `${s.nome} ${s.sobrenome}`.trim(); }

// ---------- Etapa 1: Dados Pessoais ----------
function stepDadosPessoais() {
    return `
    <h2>Dados Pessoais</h2>
    <div class="field"><label>Nome completo *</label><input type="text" id="f_nome_completo" value="${esc(nomeCompletoAtual())}"></div>
    <div class="field"><label>Qual foi o sexo atribuído no seu nascimento? *</label>
        <div class="radio-group">${pill('f_sexo', 'Masculino', s.sexo === 'Masculino')}${pill('f_sexo', 'Feminino', s.sexo === 'Feminino')}</div>
    </div>
    ${dataNascimentoFields()}
    <div class="field"><label>Nacionalidade *</label>
        <div class="radio-group">
            ${pill('f_nacionalidade', 'Brasileiro(a)', s.nacionalidade === 'Brasileiro(a)')}
            ${pill('f_nacionalidade', 'Venezuelano(a)', s.nacionalidade === 'Venezuelano(a)')}
            ${pill('f_nacionalidade', 'Haitiano(a)', s.nacionalidade === 'Haitiano(a)')}
            ${pill('f_nacionalidade', 'Outra Nacionalidade', s.nacionalidade === 'Outra Nacionalidade')}
        </div>
    </div>
    <div id="condNacionalidade"></div>
    <div id="errorMsg" class="error-msg"></div>
    <div class="nav-row"><button class="btn btn-next" onclick="window.__goNext()">Avançar</button></div>`;
}
// Naturalidade (cidade + UF onde nasceu) só faz sentido — e só é pedida —
// pra quem é Brasileiro(a) (2026-08-21). Nacionalidade estrangeira já é a
// própria informação de origem; pedir "naturalidade" nesse caso duplicava o
// que a Nacionalidade selecionada acima já diz, então o espaço fica só com o
// que já existia pra esse caso (o país de origem, quando "Outra Nacionalidade"),
// sem nenhum campo novo.
function renderCondNacionalidade() {
    const el = document.getElementById('condNacionalidade');
    if (!el) return;
    let html = '';
    if (s.nacionalidade === 'Outra Nacionalidade') {
        html += `<div class="field"><label>Qual sua nacionalidade? (seu país de origem) *</label><input type="text" id="f_nac_outra" value="${esc(s.nacionalidade_outra)}"></div>`;
    }
    if (s.nacionalidade === 'Brasileiro(a)') {
        html += `<div class="field"><label>Naturalidade — Cidade onde nasceu *</label><input type="text" id="f_naturalidade" value="${esc(s.naturalidade)}"></div>`;
        html += `<div class="field"><label>Naturalidade — Estado (UF) *</label><select id="f_estado_nasc"><option value="">Selecione</option>${estadoOptions(s.estado_nascimento)}</select></div>`;
    }
    el.innerHTML = html;
}

// ---------- Etapa 2: Família / estado civil ----------
function stepFamilia() {
    return `
    <h2>Estado Civil e Família</h2>
    <div class="field"><label>Seu estado civil? *</label>
        <select id="f_estado_civil">
            <option value="">Selecione</option>
            ${['Solteiro(a)','Casado(a)','Divorciado(a)','Viúvo(a)','União Estável'].map(o => `<option value="${o}" ${s.estado_civil === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select>
    </div>
    <div class="field"><label>Você tem filhos? *</label>
        <div class="radio-group">${pill('f_tem_filhos', 'Sim', s.tem_filhos === 'Sim')}${pill('f_tem_filhos', 'Não', s.tem_filhos === 'Não')}</div>
    </div>
    <div id="condFilhos"></div>
    <div id="errorMsg" class="error-msg"></div>
    <div class="nav-row"><button class="btn btn-back" onclick="window.__goBack()">Voltar</button><button class="btn btn-next" onclick="window.__goNext()">Avançar</button></div>`;
}
// Situação dos filhos (2026-08-21) substitui o campo livre "idade do filho
// caçula" que existia antes — vira uma das 2 opções fixas abaixo, o
// suficiente pra montar o texto do currículo (ver montarTextoFilhos em
// index.html) sem expor idade específica de menores de idade.
function renderCondFilhos() {
    const el = document.getElementById('condFilhos');
    if (!el) return;

// ---------- Etapa 3: Contato ----------
// Reformulado em 2026-08-21: lista de DDD (todos os 67 oficiais do Brasil, ver
// DDDS_BR) no lugar do atalho "é DDD 47?"/"qual o seu DDD?", e o número já
// validado/normalizado na hora (8 ou 9 dígitos — 8 dígitos ganha o "9" na
// frente automaticamente, característica de celular; qualquer outro tamanho
// é rejeitado com mensagem de correção). Continua salvando `telefone`/
// `whatsapp` como DDD+9 dígitos concatenado, sem separador — mesmo formato
// de sempre no banco, então não muda nada pra quem já lê esses campos.
const DDDS_BR = [
    ['11', 'SP'], ['12', 'SP'], ['13', 'SP'], ['14', 'SP'], ['15', 'SP'], ['16', 'SP'], ['17', 'SP'], ['18', 'SP'], ['19', 'SP'],
    ['21', 'RJ'], ['22', 'RJ'], ['24', 'RJ'],
    ['27', 'ES'], ['28', 'ES'],
    ['31', 'MG'], ['32', 'MG'], ['33', 'MG'], ['34', 'MG'], ['35', 'MG'], ['37', 'MG'], ['38', 'MG'],
    ['41', 'PR'], ['42', 'PR'], ['43', 'PR'], ['44', 'PR'], ['45', 'PR'], ['46', 'PR'],
    ['47', 'SC'], ['48', 'SC'], ['49', 'SC'],
    ['51', 'RS'], ['53', 'RS'], ['54', 'RS'], ['55', 'RS'],
    ['61', 'DF'],
    ['62', 'GO'], ['64', 'GO'],
    ['63', 'TO'],
    ['65', 'MT'], ['66', 'MT'],
    ['67', 'MS'],
    ['68', 'AC'],
    ['69', 'RO'],
    ['71', 'BA'], ['73', 'BA'], ['74', 'BA'], ['75', 'BA'], ['77', 'BA'],
    ['79', 'SE'],
    ['81', 'PE'], ['87', 'PE'],
    ['82', 'AL'],
    ['83', 'PB'],
    ['84', 'RN'],
    ['85', 'CE'], ['88', 'CE'],
    ['86', 'PI'], ['89', 'PI'],
    ['91', 'PA'], ['93', 'PA'], ['94', 'PA'],
    ['92', 'AM'], ['97', 'AM'],
    ['95', 'RR'],
    ['96', 'AP'],
    ['98', 'MA'], ['99', 'MA'],
];
function dddOptions(selecionado) {
    return DDDS_BR.map(([ddd, uf]) => `<option value="${ddd}" ${selecionado === ddd ? 'selected' : ''}>${ddd} — ${uf}</option>`).join('');
}
// 8 dígitos = número de celular sem o "9" (formato antigo/como muita gente
// ainda digita) — ganha o 9 na frente automaticamente. 9 dígitos = já
// completo, mantém como está. Qualquer outro tamanho é inválido. Retorna
// `null` quando inválido (nunca lança erro — quem chama decide a mensagem).
function normalizarTelefoneBR(numero) {
    const d = (numero || '').replace(/\D/g, '');
    if (d.length === 8) return '9' + d;
    if (d.length === 9) return d;
    return null;
}

    return `

        <div class="radio-group">${pill('f_whatsapp_mesmo', 'Sim', s.whatsapp_mesmo === 'Sim')}${pill('f_whatsapp_mesmo', 'Não', s.whatsapp_mesmo === 'Não')}</div>

const DISPONIBILIDADE_OPTS = ['Período Integral', 'Meio Período - Manhã', 'Meio Período - Tarde', 'Meio Período - Noite', 'Fins de Semana', 'Qualquer Horário'];

// Validação inteligente período de estudo × disponibilidade (2026-08-21) —
// só roda quando a escolaridade está "Em andamento" (Completo/Incompleto não
// entra em conflito nenhum, já são situações definitivas) e o período de
// estudo é um horário fixo real (Manhã/Tarde/Noite/Integral); EAD e Horário
// Variável nunca validam, porque não ocupam um horário fixo do dia. Pra cada
// período de meio turno, lista as opções de disponibilidade que colidem
// (o próprio turno, Período Integral e Qualquer Horário — todas cobririam o
// mesmo horário em que a pessoa já disse que estuda) e a sugestão de
// substituição, usando só as opções que já existem em DISPONIBILIDADE_OPTS
// (não foram inventadas opções novas tipo "comercial"/"vespertino").
const DISPONIBILIDADE_CONFLITOS = {
    'Manhã': { opcoes: ['Meio Período - Manhã', 'Período Integral', 'Qualquer Horário'], sugestao: 'Meio Período - Tarde, Meio Período - Noite ou Fins de Semana' },
    'Tarde': { opcoes: ['Meio Período - Tarde', 'Período Integral', 'Qualquer Horário'], sugestao: 'Meio Período - Manhã ou Meio Período - Noite' },
    'Noite': { opcoes: ['Meio Período - Noite', 'Período Integral', 'Qualquer Horário'], sugestao: 'Meio Período - Manhã ou Meio Período - Tarde' },
};
// Retorna `null` (sem conflito, avança normal) ou `{ mensagem }` — nunca
// bloqueia, só descreve o que foi encontrado pra mostrarAvisoDisponibilidade().
function verificarConflitoDisponibilidade() {
    if (s.situacao_escolaridade !== 'Em andamento') return null;
    const periodo = s.periodo_estudo;
    if (!periodo || periodo === 'EAD' || periodo === 'Horário Variável') return null;
    if (!s.disponibilidade.length) return null;

    if (periodo === 'Integral') {
        return { mensagem: 'Atenção: você estuda em período integral. Tem certeza que deseja manter a disponibilidade selecionada? Confirme se ela é compatível com sua rotina de estudos.' };
    }
    const regra = DISPONIBILIDADE_CONFLITOS[periodo];
    if (!regra || !s.disponibilidade.some(d => regra.opcoes.includes(d))) return null;
    return { mensagem: `Atenção: você estuda no período da ${periodo.toLowerCase()}. Tem certeza que deseja manter a disponibilidade igual? Recomendado: ${regra.sugestao}.` };
}
// Caixa de confirmação não-bloqueante — some assim que o usuário escolhe
// "Manter informação" (aí sim avança, sem rodar a validação de novo pra essa
// mesma etapa) ou "Alterar disponibilidade" (só fecha a caixa, formulário
// continua exatamente onde estava, pra pessoa editar a marcação).

// ---------- Validação e coleta por etapa ----------
function validateCurrentStep() {
    switch (stepIndex) {
        case 0:
            if (!s.nome || !s.sobrenome) return 'Informe seu nome completo (nome e sobrenome).';
            if (!s.sexo || !s.nascimento || !s.nacionalidade) return 'Preencha todos os campos obrigatórios (*).';
            if (s.nacionalidade === 'Outra Nacionalidade' && !s.nacionalidade_outra) return 'Informe sua nacionalidade.';
            if (s.nacionalidade === 'Brasileiro(a)' && (!s.naturalidade || !s.estado_nascimento)) return 'Informe sua naturalidade (cidade e estado).';
            return null;
        case 1:
            if (!s.estado_civil || !s.tem_filhos) return 'Preencha todos os campos obrigatórios (*).';
            if (s.tem_filhos === 'Sim' && (!s.qtd_filhos || !s.situacao_filhos)) return 'Informe a quantidade e a situação dos filhos.';
            return null;
        case 2:
            if (!s.ddd || !s.telefone_numero || !s.whatsapp_mesmo) return 'Preencha todos os campos obrigatórios (*).';
            if (!normalizarTelefoneBR(s.telefone_numero)) return 'Telefone inválido — informe 8 ou 9 dígitos (sem o DDD).';
            if (s.whatsapp_mesmo === 'Não') {
                if (!s.ddd_whatsapp || !s.whatsapp_numero) return 'Preencha o DDD e o número do WhatsApp.';
                if (!normalizarTelefoneBR(s.whatsapp_numero)) return 'WhatsApp inválido — informe 8 ou 9 dígitos (sem o DDD).';
            }
            return null;
        case 3:
            if (!s.rua || !s.numero || !cidadeFinal() || !bairroFinal() || !estadoResidenciaFinal()) return 'Preencha todos os campos obrigatórios (*).';
            return null;
        case 4:
            if (!s.escolaridade) return 'Selecione sua escolaridade.';
            if (!ESCOLARIDADE_SEM_SITUACAO.has(s.escolaridade) && !s.situacao_escolaridade) return 'Selecione a situação da sua escolaridade.';
            if (s.situacao_escolaridade === 'Em andamento' && !s.periodo_estudo) return 'Selecione o período em que estuda.';
            return null;
        default: return null;
    }
}
function saveCurrentStep() {
    switch (stepIndex) {
        case 0:
            // Campo único "Nome completo" na UI, separado aqui em nome (1ª
            // palavra) + sobrenome (resto) pra manter s.nome/s.sobrenome —
            // usados sem mudança no resto do arquivo, no envio e na edição.
            { const partes = val('f_nome_completo').trim().replace(/\s+/g, ' ').split(' ').filter(Boolean);
              s.nome = partes[0] || ''; s.sobrenome = partes.slice(1).join(' '); }
            s.sexo = checkedVal('f_sexo');
            { const dd = val('f_nasc_dia'), mm = val('f_nasc_mes'), yy = val('f_nasc_ano'); s.nascimento = (dd && mm && yy) ? `${yy}-${mm}-${dd}` : ''; }
            s.nacionalidade = checkedVal('f_nacionalidade');
            s.nacionalidade_outra = val('f_nac_outra'); s.naturalidade = val('f_naturalidade');
            s.estado_nascimento = val('f_estado_nasc');
            break;
        case 1:
            s.estado_civil = val('f_estado_civil'); s.tem_filhos = checkedVal('f_tem_filhos');
            s.qtd_filhos = val('f_qtd_filhos'); s.situacao_filhos = checkedVal('f_situacao_filhos');
            break;
        case 2:
            s.ddd = val('f_ddd');
            s.telefone_numero = val('f_telefone_numero'); s.whatsapp_mesmo = checkedVal('f_whatsapp_mesmo');
            s.ddd_whatsapp = val('f_ddd_whatsapp'); s.whatsapp_numero = val('f_whatsapp_numero');
            break;
        case 3:
            s.tem_email = checkedVal('f_tem_email'); s.email = val('f_email');
            s.rua = val('f_rua'); s.numero = val('f_numero'); s.complemento = val('f_complemento');
            s.cidade = val('f_cidade');
            if (!estadoForcadoSC()) s.estado_residencia = val('f_estado_res');
            break;
        case 4:
            s.escolaridade = val('f_escolaridade');
            s.situacao_escolaridade = val('f_situacao_escolaridade');
            s.periodo_estudo = val('f_periodo_estudo');
            break;
        case 5:
            s.fez_curso = checkedVal('f_fez_curso');
            document.querySelectorAll('[data-curso]').forEach(inp => {
                const i = +inp.dataset.curso, f = inp.dataset.field;
                if (s.cursos[i]) s.cursos[i][f] = inp.value;
            });
            break;
        case 6:
            s.informatica = val('f_informatica'); s.outros_idiomas = checkedVal('f_outros_idiomas');
            document.querySelectorAll('[data-idioma]').forEach(inp => {
                const i = +inp.dataset.idioma, f = inp.dataset.field;
                if (s.idiomas[i]) s.idiomas[i][f] = inp.value;
            });
            break;
        case 7:
            s.tem_experiencia = checkedVal('f_tem_experiencia');
            document.querySelectorAll('[data-empresa]').forEach(inp => {
                const i = +inp.dataset.empresa, f = inp.dataset.field;
                if (s.empresas[i]) s.empresas[i][f] = inp.value;
            });
            break;
        case 8:
            document.querySelectorAll('[data-ref]').forEach(inp => {
                const i = +inp.dataset.ref, f = inp.dataset.field;
                if (s.referencias[i]) s.referencias[i][f] = inp.value;
            });
            break;
        case 9:
            s.fumante = checkedVal('f_fumante');
            s.disponibilidade = Array.from(document.querySelectorAll('[data-disp]:checked')).map(c => c.value);
            s.destacar_cargo = checkedVal('f_destacar_cargo'); s.qual_cargo = val('f_qual_cargo');
            s.tipo_cargo_busca = val('f_tipo_cargo');
            break;
        case 10:
            s.tem_cnh = checkedVal('f_tem_cnh'); s.categoria_cnh = val('f_categoria_cnh'); s.tem_ear = checkedVal('f_tem_ear');
            break;
    }
}
function val(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function checkedVal(name) { const e = document.querySelector(`input[name="${name}"]:checked`); return e ? e.value : ''; }

function bindStepEvents() {
    // re-render blocos condicionais quando o rádio pai muda
    document.querySelectorAll('input[name="f_nacionalidade"]').forEach(r => r.addEventListener('change', () => { s.nacionalidade = checkedVal('f_nacionalidade'); renderCondNacionalidade(); }));
    document.querySelectorAll('input[name="f_tem_filhos"]').forEach(r => r.addEventListener('change', () => { s.tem_filhos = checkedVal('f_tem_filhos'); renderCondFilhos(); }));
    document.querySelectorAll('input[name="f_whatsapp_mesmo"]').forEach(r => r.addEventListener('change', () => { s.whatsapp_mesmo = checkedVal('f_whatsapp_mesmo'); renderCondWhatsapp(); }));
    document.querySelectorAll('input[name="f_tem_email"]').forEach(r => r.addEventListener('change', () => { s.tem_email = checkedVal('f_tem_email'); renderCondEmail(); }));
    const selCidade = document.getElementById('f_cidade');
    if (selCidade) selCidade.addEventListener('change', () => { s.cidade = selCidade.value; s.bairro = ''; s.estado_residencia = estadoForcadoSC() ? 'SC' : ''; renderCondCidade(); renderCondEstadoResidencia(); });
    const selEscolaridade = document.getElementById('f_escolaridade');
    if (selEscolaridade) selEscolaridade.addEventListener('change', () => { s.escolaridade = selEscolaridade.value; s.situacao_escolaridade = ''; s.periodo_estudo = ''; renderCondEscolaridade(); });
    document.querySelectorAll('input[name="f_fez_curso"]').forEach(r => r.addEventListener('change', () => { s.fez_curso = checkedVal('f_fez_curso'); renderCursosArea(); }));
    document.querySelectorAll('input[name="f_outros_idiomas"]').forEach(r => r.addEventListener('change', () => { s.outros_idiomas = checkedVal('f_outros_idiomas'); renderCondIdiomas(); }));
    document.querySelectorAll('input[name="f_tem_experiencia"]').forEach(r => r.addEventListener('change', () => { s.tem_experiencia = checkedVal('f_tem_experiencia'); renderEmpresasArea(); }));
    document.querySelectorAll('input[name="f_destacar_cargo"]').forEach(r => r.addEventListener('change', () => { s.destacar_cargo = checkedVal('f_destacar_cargo'); renderCondCargo(); }));
    document.querySelectorAll('input[name="f_tem_cnh"]').forEach(r => r.addEventListener('change', () => { s.tem_cnh = checkedVal('f_tem_cnh'); renderCondCnh(); }));

    const fotoInput = document.getElementById('f_foto');
    if (fotoInput) fotoInput.addEventListener('change', () => {
        const file = fotoInput.files && fotoInput.files[0];
        if (!file) return;
        fotoFile = file;
        fotoPreviewUrl = URL.createObjectURL(file);
        renderFotoPreview();
    });

    const btnSubmit = document.getElementById('btnSubmit');
    if (btnSubmit) btnSubmit.addEventListener('click', submitForm);

    // renders iniciais dos blocos condicionais/repetíveis da etapa atual
    renderCondNacionalidade(); renderCondFilhos(); renderCondWhatsapp();
    renderCondEmail(); renderCondCidade(); renderCondEstadoResidencia(); renderCondEscolaridade(); renderCursosArea(); renderCondIdiomas();
    renderEmpresasArea(); renderReferenciasArea(); renderCondCargo(); renderCondCnh();
    renderFotoPreview();
}
function saveCurso() { document.querySelectorAll('[data-curso]').forEach(inp => { const i = +inp.dataset.curso, f = inp.dataset.field; if (s.cursos[i]) s.cursos[i][f] = inp.value; }); }
function saveEmpresa() { document.querySelectorAll('[data-empresa]').forEach(inp => { const i = +inp.dataset.empresa, f = inp.dataset.field; if (s.empresas[i]) s.empresas[i][f] = inp.value; }); }
function saveRef() { document.querySelectorAll('[data-ref]').forEach(inp => { const i = +inp.dataset.ref, f = inp.dataset.field; if (s.referencias[i]) s.referencias[i][f] = inp.value; }); }

// ---------- Envio ----------
async function submitForm() {
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true; btn.textContent = 'Enviando...';

    // Continua salvando DDD+9 dígitos concatenado, sem separador — mesmo
    // formato de sempre nas colunas `telefone`/`whatsapp` (normalizarTelefoneBR
    // garante os 9 dígitos mesmo se a pessoa digitou só 8, sem o "9" na frente).
    const telNormalizado = normalizarTelefoneBR(s.telefone_numero);
    const telefone = telNormalizado ? (s.ddd || '') + telNormalizado : null;
    const waNormalizado = s.whatsapp_mesmo === 'Sim' ? telNormalizado : normalizarTelefoneBR(s.whatsapp_numero);
    const whatsapp = s.whatsapp_mesmo === 'Sim' ? telefone : (waNormalizado ? (s.ddd_whatsapp || '') + waNormalizado : null);

    const dados = {};
    const put = (k, v) => { if (v !== '' && v != null) dados[k] = v; };
    // Rua/Número/Complemento não têm coluna própria na tabela curriculos (só
    // "endereco" já composto) — ficam soltos aqui dentro de `dados` só pra dar
    // pra recarregar certinho no modo de edição (ver carregarParaEdicao).
    put('rua', s.rua); put('numero', s.numero); put('complemento', s.complemento);
    put('QUAL FOI O SEXO ATRIBUÍDO NO SEU NASCIMENTO?', s.sexo);
    put('QUAL SUA NACIONALIDADE? (Seu País de Origem)', s.nacionalidade_outra);
    put('NATURALIDADE? (Apenas o nome da da cidade onde você nasceu)', s.naturalidade);
    put('EM QUAL ESTADO?', s.estado_nascimento);
    put('VOCÊ TEM FILHOS?', s.tem_filhos);
    put('QUANTOS FILHOS?', s.qtd_filhos);
    put('QUAL A SITUAÇÃO DOS SEUS FILHOS?', s.situacao_filhos);
    put('QUAL A SUA ESCOLARIDADE?', s.escolaridade);
    put('QUAL A SITUAÇÃO DA SUA ESCOLARIDADE?', s.situacao_escolaridade);
    put('EM QUE PERÍODO VOCÊ ESTUDA?', s.periodo_estudo);
    put('VOCÊ JÁ FEZ ALGUM TIPO DE CURSO PROFISSIONALIZANTE?', s.fez_curso);
    if (s.fez_curso === 'Sim') {
        s.cursos.forEach((c, i) => {
            const n = i + 1;
            put(`INFORME O CURSO VOCÊ CONCLUIU? (${n})`, c.curso);
            put(`EM QUAL INSTITUIÇÃO? (${n})`, c.instituicao);
            put(`TOTAL DA CARGA HORÁRIA? (${n})`, c.carga);
        });
    }
    put('MESMO SEM CURSO VOCÊ TERIA ALGUM CONHECIMENTO OU NOÇÃO EM INFORMÁTICA (computadores)', s.informatica);
    put('ALÉM DO SEU IDIOMA NATIVO (natural da sua Região) VOCÊ POSSSUI CONHECIMENTO DE OUTROS IDIOMAS?', s.outros_idiomas);
    if (s.outros_idiomas === 'Sim') {
        s.idiomas.forEach((it, i) => {
            const n = i + 1;
            put(`QUAL IDIOMA VOCÊ FALA? (${n})`, it.idioma);
            put(`QUAL O NÍVEL DE CONHECIMENTO NESSE IDIOMA? (${n})`, it.nivel);
        });
    }
    put('VOCÊ TEM ALGUMA EXPERÊNCIA PROFISSIONAL OU ESTA BUSCANDO SEU PRIMEIRO EMPREGO?', s.tem_experiencia);
    if (s.tem_experiencia === 'Tenho experiência') {
        s.empresas.forEach((e, i) => {
            const n = i + 1;
            put(`NOME DA EMPRESA QUE VOCÊ JA PRESTOU SERVIÇO (${n})`, e.nome);
            put(`QUAL ERA O SEU CARGO NESSA EMPRESA? (${n})`, e.cargo);
            put(`QUAL FOI O PERÍODO QUE VOCÊ TRABALHOU NESSA EMPRESA? (${n})`, e.periodo);
        });
    }
    s.referencias.forEach((r, i) => {
        if (!r.nome) return;
        const n = i + 1;
        put(`QUAL SERIA O NOME DA REFERÊNCIA (${n})`, r.nome);
        put(`E QUAL SERIA O CODIGO DE DDD DO TELEFONE DESSE CONTATO (${n})`, r.ddd);
        put(`AGORA O NUMERO DO SEU TELEFONE DA REFERÊNCIA (${n})? (sem DDD)`, r.numero);
    });
    put('VOCÊ FUMANTE?', s.fumante);
    put('MEDIANTE A SUA DISPONIBILIDADE DE HORÁRIO, QUAL DESSAS OPÇÕES PODEMOS DEIXAR EM SEU CURRÍCULO?', s.disponibilidade.join(', '));
    put('GOSTARIA DESTACAR EM SEU CURRÍCULO ALGUM CARGO DE PREFERÊNCIA?', s.destacar_cargo);
    put('QUAL TIPO DE CARGO VOCÊ BUSCA NO MERCADO DE TRABALHO?', s.qual_cargo || s.tipo_cargo_busca);
    put('VOCÊ POSSUI CARTEIRA DE HABILITAÇÃO?', s.tem_cnh);
    put('QUAL CATEGORIA DA SUA CNH?', s.categoria_cnh);
    put('SUA HABILITAÇÃO POSSUI EXTENSÃO PRA EAR? (Autorização pra serviços de motorista com remuneração tipo uber)', s.tem_ear);

    // Se não mexeu na foto, preserva a que já existia (edição) — só troca se
    // escolheu um arquivo novo, só limpa se clicou em "remover foto".
    let foto_url = fotoUrlOriginal || null;
    if (fotoFile) {
        const ext = (fotoFile.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${crypto.randomUUID()}.${ext}`;
        const { error: uploadError } = await supabase.storage.from('curriculo-fotos').upload(path, fotoFile, { contentType: fotoFile.type || 'image/jpeg' });
        if (uploadError) {
            showError('Não deu pra enviar a foto. Você pode voltar e tentar de novo, ou pular a foto e enviar sem ela.');
            btn.disabled = false; btn.textContent = editMode ? 'Salvar alterações' : 'Enviar currículo';
            return;
        }
        foto_url = supabase.storage.from('curriculo-fotos').getPublicUrl(path).data.publicUrl;
    } else if (fotoRemovida) {
        foto_url = null;
    }

    const registro = {
        nome: s.nome, sobrenome: s.sobrenome || null,
        data_nascimento: s.nascimento || null,
        genero: s.sexo || null,
        nacionalidade: s.nacionalidade || null,
        estado_civil: s.estado_civil || null,
        telefone, whatsapp,
        email: s.tem_email === 'Sim' ? (s.email || null) : null,
        endereco: enderecoFinal() || null, bairro: bairroFinal() || null,
        cidade: cidadeFinal() || null, estado: estadoResidenciaFinal() || null,
        dados, foto_url,
    };
    // Status e data do pedido original não devem mudar só porque corrigiu um
    // dado — senão editar um currículo já marcado "Feito" voltaria pendente.
    if (!editMode) { registro.status = 'PENDENTE'; registro.data_pedido = new Date().toISOString(); }

    if (editMode) {
        // O formulário público não tem (e não deve ter) a senha de escrita da
        // equipe — só o painel tem, depois de desbloqueado. Por isso quem grava
        // a edição é o painel: a gente só manda os dados prontos e espera a
        // resposta (ver window.addEventListener('message') abaixo).
        avisarPai({ type: 'form-salvar-pedido', table: 'curriculos', id: editId, registro });
        return;
    }

    const { error } = await supabase.from('curriculos').insert(registro);
    if (error) {
        showError('Não deu pra enviar agora. Tenta de novo em alguns segundos — se persistir, chama a gente pelo WhatsApp.');
        btn.disabled = false; btn.textContent = 'Enviar currículo';
        return;
    }
    document.getElementById('cardArea').innerHTML = `
        <div class="success-box">
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>
            <h2>Currículo enviado!</h2>
            <p>Recebemos suas informações. A equipe da Blackout vai entrar em contato quando o currículo estiver pronto.</p>
        </div>`;
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('stepLabel').textContent = 'Concluído';
}
// Resposta do painel ao pedido de salvar (form-salvar-pedido) — só existe
// quando o formulário está embutido no iframe de edição do painel.
window.addEventListener('message', (ev) => {
    if (ev.origin !== window.location.origin) return;
    if (!ev.data || ev.data.type !== 'form-salvar-resultado') return;
    const btn = document.getElementById('btnSubmit');
    if (ev.data.ok) {
        document.getElementById('cardArea').innerHTML = `
            <div class="success-box">
                <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>
                <h2>Alterações salvas!</h2>
                <p>O currículo foi atualizado.</p>
            </div>`;
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('stepLabel').textContent = 'Concluído';
    } else {
        showError(ev.data.error || 'Não deu pra salvar agora. Tenta de novo em alguns segundos — se persistir, chama a gente pelo WhatsApp.');
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar alterações'; }
    }
});

// ---------- Modo de edição (reabre o formulário já preenchido a partir de um
// registro existente em `curriculos`, pra corrigir sem duplicar) ----------
let editMode = false;
let editId = null;

function avisarPai(msg) {
    if (window.parent && window.parent !== window) window.parent.postMessage(msg, window.location.origin);
}
function cancelarEdicao() {
    avisarPai({ type: 'form-editar-cancelado' });
    if (window.parent === window) history.back();
}
window.__cancelarEdicao = cancelarEdicao;

// `dados` guarda cada resposta com a pergunta inteira como chave (compatível
// com os registros antigos da planilha) — put()/get() aqui é só o caminho
// inverso do put() usado no submitForm, campo por campo, mesma chave exata.
// Registro salvo antes dessa versão do formulário — só tinha o endereço já
// junto. Não dá pra separar com segurança, então joga tudo em "Rua" e deixa
// Número/Complemento em branco pro usuário ajustar.
function carregarEnderecoSolto(rua, numero, complemento, enderecoComposto) {
    if (rua || numero || complemento) {
        s.rua = rua || ''; s.numero = numero || ''; s.complemento = complemento || '';
    } else if (enderecoComposto) {
        s.rua = enderecoComposto; s.numero = ''; s.complemento = '';
    }
}
function carregarParaEdicao(row) {
    const dados = row.dados || {};
    const get = (k) => dados[k] ?? '';

    s.nome = row.nome || ''; s.sobrenome = row.sobrenome || '';
    s.sexo = row.genero || '';
    s.nascimento = row.data_nascimento || '';
    s.nacionalidade = row.nacionalidade || '';
    s.estado_civil = row.estado_civil || '';
    s.nacionalidade_outra = get('QUAL SUA NACIONALIDADE? (Seu País de Origem)');
    s.naturalidade = get('NATURALIDADE? (Apenas o nome da da cidade onde você nasceu)');
    s.estado_nascimento = get('EM QUAL ESTADO?');

    s.tem_filhos = get('VOCÊ TEM FILHOS?');
    s.qtd_filhos = get('QUANTOS FILHOS?');
    s.situacao_filhos = get('QUAL A SITUAÇÃO DOS SEUS FILHOS?');

    // Telefone/whatsapp são salvos como DDD+número concatenado, sem separador
    // — só dá pra separar de volta porque DDD brasileiro é sempre 2 dígitos.
    const tel = row.telefone || '';
    if (tel.length >= 2) {
        s.ddd = tel.slice(0, 2);
        s.telefone_numero = tel.slice(2);
    }
    const wa = row.whatsapp || '';
    if (wa && wa === tel) {
        s.whatsapp_mesmo = 'Sim';
    } else if (wa) {
        s.whatsapp_mesmo = 'Não';
        s.ddd_whatsapp = wa.slice(0, 2);
        s.whatsapp_numero = wa.slice(2);
    } else if (tel) {
        s.whatsapp_mesmo = 'Não';
    }
    s.tem_email = row.email ? 'Sim' : 'Não';
    s.email = row.email || '';
    carregarEnderecoSolto(get('rua'), get('numero'), get('complemento'), row.endereco);
    carregarCidadeBairro(row.cidade, row.bairro);
    s.estado_residencia = row.estado || '';

    s.escolaridade = get('QUAL A SUA ESCOLARIDADE?');
    s.situacao_escolaridade = get('QUAL A SITUAÇÃO DA SUA ESCOLARIDADE?');
    s.periodo_estudo = get('EM QUE PERÍODO VOCÊ ESTUDA?');

    s.fez_curso = get('VOCÊ JÁ FEZ ALGUM TIPO DE CURSO PROFISSIONALIZANTE?');
    s.cursos = [];
    for (let n = 1; n <= 5; n++) {
        const curso = get(`INFORME O CURSO VOCÊ CONCLUIU? (${n})`);
        const instituicao = get(`EM QUAL INSTITUIÇÃO? (${n})`);
        const carga = get(`TOTAL DA CARGA HORÁRIA? (${n})`);
        if (curso || instituicao || carga) s.cursos.push({ curso, instituicao, carga });
    }

    s.informatica = get('MESMO SEM CURSO VOCÊ TERIA ALGUM CONHECIMENTO OU NOÇÃO EM INFORMÁTICA (computadores)');
    s.outros_idiomas = get('ALÉM DO SEU IDIOMA NATIVO (natural da sua Região) VOCÊ POSSSUI CONHECIMENTO DE OUTROS IDIOMAS?');
    s.idiomas = [];
    for (let n = 1; n <= 5; n++) {
        const idioma = get(`QUAL IDIOMA VOCÊ FALA? (${n})`);
        const nivel = get(`QUAL O NÍVEL DE CONHECIMENTO NESSE IDIOMA? (${n})`);
        if (idioma || nivel) s.idiomas.push({ idioma, nivel });
    }

    s.tem_experiencia = get('VOCÊ TEM ALGUMA EXPERÊNCIA PROFISSIONAL OU ESTA BUSCANDO SEU PRIMEIRO EMPREGO?');
    s.empresas = [];
    for (let n = 1; n <= 4; n++) {
        const nomeEmp = get(`NOME DA EMPRESA QUE VOCÊ JA PRESTOU SERVIÇO (${n})`);
        const cargo = get(`QUAL ERA O SEU CARGO NESSA EMPRESA? (${n})`);
        const periodo = get(`QUAL FOI O PERÍODO QUE VOCÊ TRABALHOU NESSA EMPRESA? (${n})`);
        if (nomeEmp || cargo || periodo) s.empresas.push({ nome: nomeEmp, cargo, periodo });
    }

    s.referencias = [];
    for (let n = 1; n <= 2; n++) {
        const nomeRef = get(`QUAL SERIA O NOME DA REFERÊNCIA (${n})`);
        const ddd = get(`E QUAL SERIA O CODIGO DE DDD DO TELEFONE DESSE CONTATO (${n})`);
        const numero = get(`AGORA O NUMERO DO SEU TELEFONE DA REFERÊNCIA (${n})? (sem DDD)`);
        if (nomeRef || ddd || numero) s.referencias.push({ nome: nomeRef, ddd, numero });
    }

    s.fumante = get('VOCÊ FUMANTE?');
    s.disponibilidade = get('MEDIANTE A SUA DISPONIBILIDADE DE HORÁRIO, QUAL DESSAS OPÇÕES PODEMOS DEIXAR EM SEU CURRÍCULO?').split(', ').filter(Boolean);
    s.destacar_cargo = get('GOSTARIA DESTACAR EM SEU CURRÍCULO ALGUM CARGO DE PREFERÊNCIA?');
    // No envio original esse campo mistura qual_cargo/tipo_cargo_busca num só
    // (put(...,s.qual_cargo || s.tipo_cargo_busca)) — não dá pra saber qual dos
    // dois gerou o valor salvo, então preenche os dois de volta com segurança.
    const tipoCargo = get('QUAL TIPO DE CARGO VOCÊ BUSCA NO MERCADO DE TRABALHO?');
    s.qual_cargo = tipoCargo; s.tipo_cargo_busca = tipoCargo;

    s.tem_cnh = get('VOCÊ POSSUI CARTEIRA DE HABILITAÇÃO?');
    s.categoria_cnh = get('QUAL CATEGORIA DA SUA CNH?');
    s.tem_ear = get('SUA HABILITAÇÃO POSSUI EXTENSÃO PRA EAR? (Autorização pra serviços de motorista com remuneração tipo uber)');

    if (row.foto_url) { fotoUrlOriginal = row.foto_url; fotoPreviewUrl = row.foto_url; }
}

async function iniciar() {
    const params = new URLSearchParams(location.search);
    const id = params.get('editId');
    buildSteps();
    if (!id) { render(); return; }
    editMode = true; editId = id;
    document.getElementById('cardArea').innerHTML = '<p style="color:var(--text-dim); font-size:13px;">Carregando currículo…</p>';
    const { data, error } = await supabase.from('curriculos').select('*').eq('id', id).single();
    if (error || !data) {
        document.getElementById('cardArea').innerHTML = `
            <h2>Não foi possível abrir este currículo</h2>
            <p style="color:var(--text-dim); font-size:13px;">O registro não foi encontrado.</p>`;
        return;
    }
    carregarParaEdicao(data);
    const headerP = document.querySelector('.header p');
    if (headerP) headerP.textContent = 'Corrija os dados abaixo e salve as alterações.';
    render();
}

window.__goNext = goNext;
window.__goBack = goBack;
iniciar();
</script>
