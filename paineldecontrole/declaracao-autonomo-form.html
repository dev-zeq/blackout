     foi unificado no "Declaração de Trabalho" (2026-08-30, declaracao-trabalho-form.html).

<script>
(function () {
  var p = new URLSearchParams(location.search);
  var editId = p.get('editId');
  var alvo = editId
    ? 'declaracao-trabalho-form.html?editId=' + encodeURIComponent(editId)
    : 'declaracao-trabalho-form.html?cenario=AUTONOMO';
  location.replace(alvo);
})();
</script>
